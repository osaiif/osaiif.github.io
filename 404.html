<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tvbox - not found</title>
  <script>
  (function () {
    var m = location.pathname.match(/^\/(p|g|y|m)\/([^\/]+)\/?$/);
    if (!m) return;
    var key = m[1] === 'y' ? 'y' : 's';
    var extra = location.search ? '&' + location.search.slice(1) : '';
    location.replace('/' + m[1] + '/?' + key + '=' + m[2] + extra + location.hash);
  })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;margin:0">
  <h1 style="font-weight:500">Page not found</h1>
  <a href="/home/" style="color:#fff">Back to tvbox</a>
</body>
</html>
