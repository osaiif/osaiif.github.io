<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>News ǀ tvbox</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/searchbar.css">
  <script src="/js/searchbar.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
  <link rel="preconnect" href="https://content.guardianapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap" rel="stylesheet">
  <style>
    .site-header {
      position: relative;
      height: 52px;
      background-color: #0b121e;
    }
    @media (min-width: 1024px) {
      .site-header { height: 76px; }
    }
    .page-content {
      padding-top: 0px;
    }
    .news-list {
      margin-bottom: 26px;
    }
    .news-item {
      display: block;
      padding: 14px 0;
      border-bottom: 1px solid #1e2a3e;
      text-decoration: none;
    }
    .news-item:last-child {
      border-bottom: none;
    }
    .news-title {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      color: #dde2eb;
      transition: color 0.15s ease;
    }
    .news-item:hover .news-title {
      color: #fff;
    }
    .news-summary {
      margin: 0 0 6px;
      font-size: 13px;
      line-height: 1.5;
      color: #8490a4;
    }
    .news-meta {
      margin: 0;
      font-size: 11px;
      color: #8490a4;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
    <a href="/about/" class="floating-tvbox" aria-label="TV Box">
      <svg class="tvbox-icon" aria-hidden="true" viewBox="0 0 100 100" width="13" height="13" style="flex-shrink: 0;">
        <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="7" />
        <text x="50" y="50" font-family="Arial, sans-serif" font-size="76" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="currentColor">t</text>
      </svg>
    </a>
    <a href="/home/" class="floating-home -beside-tvbox" aria-label="Home">
      <svg class="home-icon" aria-hidden="true" viewBox="0 0 24 24">
        <path d="M12 3.1l8.5 7.6c.32.29.5.7.5 1.13V20a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-5h-4v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-8.17c0-.43.18-.84.5-1.13L12 3.1z"></path>
      </svg>
    </a>
    <input type="checkbox" id="auth-menu-toggle" class="auth-checkbox">
    <input type="checkbox" id="signin-toggle" class="auth-checkbox">
    <input type="checkbox" id="signup-toggle" class="auth-checkbox">
    <label for="auth-menu-toggle" class="floating-auth -right" aria-label="Account">
      <svg class="auth-icon" aria-hidden="true" viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
      </svg>
    </label>
    <label for="auth-menu-toggle" class="auth-backdrop" aria-hidden="true"></label>
    <div class="auth-dropdown">
      <label for="signin-toggle" class="auth-dropdown-btn">Sign In</label>
      <label for="signup-toggle" class="auth-dropdown-btn">Sign Up</label>
    </div>
    <div class="auth-modal-wrap signin-modal-wrap">
      <label for="signin-toggle" class="auth-modal-backdrop" aria-hidden="true"></label>
      <div class="auth-modal-box"></div>
    </div>
    <div class="auth-modal-wrap signup-modal-wrap">
      <label for="signup-toggle" class="auth-modal-backdrop" aria-hidden="true"></label>
      <div class="auth-modal-box"></div>
    </div>
    <form class="group floating-search" id="home-search-form" action="/search/" method="get">
      <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24">
        <path d="M21.53 20.47l-3.66-3.66C19.19 15.37 20 13.28 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.28 0 4.37-.81 6.04-2.13l3.66 3.66c.14.14.33.21.53.21s.39-.07.53-.21c.29-.29.29-.77 0-1.06zM11 18c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"></path>
      </svg>
      <input id="home-search-input" name="q" placeholder="search" type="search" class="input" autocomplete="off">
      <button type="submit" hidden>Search</button>
    </form>
    </div>
  </header>
  <div class="page-content">
    <section>
      <h2 class="section-heading">Film &amp; TV News</h2>
      <div class="news-list" id="news-list"></div>
    </section>
    <section class="discover-row -visible">
      <h2 class="section-heading">In Theaters</h2>
      <div class="carousel-wrap">
        <div class="carousel-track" id="theaters-track"></div>
      </div>
    </section>
    <section class="discover-row -visible">
      <h2 class="section-heading">Coming Soon</h2>
      <div class="carousel-wrap">
        <div class="carousel-track" id="upcoming-track"></div>
      </div>
    </section>
  </div>
<footer class="site-footer">
<div class="footer-container">
<p style="display: inline-flex; align-items: center; gap: 0.35rem;">
© 2023 <a href="/about/"><strong>tvbox</strong></a> | Data from <a href="https://www.themoviedb.org/">TMDB</a> | News from <a href="https://www.theguardian.com/" target="_blank" rel="noopener">The Guardian</a>
</p>
</div>
</footer>
  <div id="page-loading-overlay" class="page-loading-overlay">
    <div class="spinner">
      <div></div><div></div><div></div><div></div><div></div><div></div>
    </div>
  </div>
  <script>
    (function () {
      var form = document.getElementById('home-search-form');
      var input = document.getElementById('home-search-input');
      var overlay = document.getElementById('page-loading-overlay');
      function goToResults() {
        var value = input.value.trim();
        if (!value) return;
        overlay.classList.add('-visible');
        window.location.href = '/search/?q=' + encodeURIComponent(value);
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        goToResults();
      });
      input.addEventListener('search', function () {
        goToResults();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          goToResults();
        }
      });
      window.addEventListener('pageshow', function () {
        overlay.classList.remove('-visible');
      });
    })();
  </script>
  <script src="/js/news.js?v=1"></script>
  <script>
    (function () {
      var TMDB_BASE = 'https://api.themoviedb.org/3';
      var TMDB_API_KEYS = [
        '6cb6e1dc603bc65ffb6198489d5bc5b7',
        '2e7b2fe7002c21f45f08c0a03aa9df52',
        '51952b66efcd80289c3ba5f8f8044e6a'
      ];
      var POSTER_BASE = 'https://image.tmdb.org/t/p/w342';
      var KEY_START = Math.floor(Math.random() * TMDB_API_KEYS.length);
      var news = window.tvboxNews;
      function tmdb(path, attempt) {
        attempt = attempt || 0;
        var key = TMDB_API_KEYS[(KEY_START + attempt) % TMDB_API_KEYS.length];
        return fetch(TMDB_BASE + path + (path.indexOf('?') === -1 ? '?' : '&') + 'api_key=' + key)
          .then(function (res) {
            if (!res.ok) throw new Error('TMDB request failed (' + res.status + ')');
            return res.json();
          })
          .catch(function (err) {
            if (attempt + 1 >= TMDB_API_KEYS.length) throw err;
            return tmdb(path, attempt + 1);
          });
      }
      function showNewsMessage(text) {
        var list = document.getElementById('news-list');
        list.innerHTML = '';
        list.appendChild(news.textEl('p', 'no-results', text));
      }
      news.load()
        .then(function (items) {
          if (!items.length) {
            showNewsMessage('No news right now.');
            return;
          }
          var list = document.getElementById('news-list');
          list.innerHTML = '';
          items.forEach(function (item) {
            list.appendChild(news.buildItem(item, item.webUrl, true));
          });
        })
        .catch(function (err) {
          console.error('News failed to load:', err);
          showNewsMessage('News is unavailable right now.');
        });
      function addNav(track) {
        var wrap = track.parentNode;
        var prevBtn = document.createElement('button');
        prevBtn.type = 'button';
        prevBtn.className = 'carousel-nav -prev';
        prevBtn.setAttribute('aria-label', 'Scroll left');
        prevBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>';
        prevBtn.addEventListener('click', function () {
          track.scrollBy({ left: -track.clientWidth * 0.8, behavior: 'smooth' });
        });
        var nextBtn = document.createElement('button');
        nextBtn.type = 'button';
        nextBtn.className = 'carousel-nav -next';
        nextBtn.setAttribute('aria-label', 'Scroll right');
        nextBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>';
        nextBtn.addEventListener('click', function () {
          track.scrollBy({ left: track.clientWidth * 0.8, behavior: 'smooth' });
        });
        wrap.appendChild(prevBtn);
        wrap.appendChild(nextBtn);
        function updateNav() {
          var max = track.scrollWidth - track.clientWidth;
          prevBtn.style.visibility = track.scrollLeft <= 4 ? 'hidden' : '';
          nextBtn.style.visibility = track.scrollLeft >= max - 4 ? 'hidden' : '';
        }
        track.addEventListener('scroll', updateNav, { passive: true });
        window.addEventListener('resize', updateNav);
        updateNav();
      }
      function buildRow(trackId, path) {
        var track = document.getElementById(trackId);
        tmdb(path)
          .then(function (data) {
            var movies = (data.results || []).filter(function (m) {
              return m && m.title && m.poster_path;
            }).slice(0, 18);
            if (!movies.length) {
              track.closest('section').remove();
              return;
            }
            movies.forEach(function (m) {
              var card = document.createElement('a');
              card.className = 'carousel-card';
              card.href = '/m/?id=' + m.id;
              var poster = document.createElement('div');
              poster.className = 'carousel-poster';
              var img = document.createElement('img');
              img.src = POSTER_BASE + m.poster_path;
              img.alt = m.title;
              img.width = 132;
              img.height = 198;
              img.loading = 'lazy';
              img.decoding = 'async';
              poster.appendChild(img);
              var body = document.createElement('div');
              body.className = 'carousel-card-body';
              body.appendChild(news.textEl('p', 'carousel-card-title', m.title));
              var date = news.formatDate(m.release_date, 'UTC');
              if (date) body.appendChild(news.textEl('div', 'carousel-card-meta', date));
              card.appendChild(poster);
              card.appendChild(body);
              track.appendChild(card);
            });
            addNav(track);
          })
          .catch(function (err) {
            console.error(path + ' failed to load:', err);
            track.closest('section').remove();
          });
      }
      buildRow('theaters-track', '/movie/now_playing');
      buildRow('upcoming-track', '/movie/upcoming');
    })();
  </script>
<script src="/js/auth.js?v=1"></script>
</body>
</html>
