  <style>
    .site-header { position: relative; height: 52px; background-color: #0b121e; }
    @media (min-width: 1024px) { .site-header { height: 76px; } }
    .page-content { padding-top: 0px; width: 100%; min-width: 0; }
    .cg-page { margin-top: 6px; }
    .cg-top { margin-bottom: 4px; }
    .cg-title-row { position: relative; display: flex; justify-content: center; min-width: 0; }
    .cg-title { margin: 0; font-size: 1.25rem; line-height: 1.2; color: #fff; display: flex; justify-content: center; min-width: 0; max-width: 100%; }
    .cg-pick-trigger { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; margin: 0; padding: 4px 8px; border: 0; background: none; color: #fff; font: inherit; line-height: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .cg-pick-trigger:focus-visible { outline: 2px solid #4a6a85; outline-offset: 2px; border-radius: 6px; }
    .cg-pick-text { color: #fff; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cg-pick-chevron { flex: none; width: 13px; height: 13px; fill: none; stroke: #8490a4; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.15s ease, transform 0.15s ease; }
    .cg-pick-trigger:hover .cg-pick-chevron, .cg-pick-trigger:focus-visible .cg-pick-chevron, .cg-pick-trigger[aria-expanded="true"] .cg-pick-chevron { stroke: #fff; }
    .cg-pick-trigger[aria-expanded="true"] .cg-pick-chevron { transform: rotate(180deg); }
    .cg-title-row .cg-pick-menu { left: 50%; right: auto; transform: translate(-50%, -4px); width: max-content; min-width: 120px; max-width: calc(100vw - 24px); max-height: min(60vh, 340px); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; visibility: hidden; transition: opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s; }
    .cg-title-row .cg-pick-menu.-open { transform: translate(-50%, 0); visibility: visible; transition-delay: 0s; }
    .cg-title-row .cg-pick-menu .sort-row { justify-content: stretch; padding: 4px; }
    .cg-title-row .cg-pick-menu .sort-choices { flex-direction: column; flex-wrap: nowrap; align-items: stretch; width: 100%; }
    .cg-title-row .cg-pick-menu .sort-option { text-align: center; }
    .cg-year-option { font-family: var(--font-numbers); }
    .cg-title-label { color: #eaeef5; }
    .cg-bar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; align-items: center; }
    .cg-bar[hidden], .cg-extra[hidden] { display: none; }
    .cg-extra { margin-top: 8px; }
    .cg-field { position: relative; display: flex; align-items: center; width: 100%; min-width: 0; height: 34px; padding: 0 28px 0 11px; border: 1px solid #1a2436; border-radius: 8px; color: #8490a4; font-size: 12.5px; cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease; }
    .cg-field[hidden] { display: none; }
    .cg-field.-set { color: #fff; border-color: #30485a; }
    .cg-field:hover { border-color: #30485a; }
    .cg-field:focus-within { border-color: #4a6a85; }
    .cg-field.-open { border-color: #4a6a85; }
    .cg-field-select { display: none; }
    .cg-field-trigger { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; border-radius: 8px; background: transparent; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
    .cg-field.-open .cg-field-chevron { stroke: #fff; transform: rotate(180deg); }
    .cg-field .cg-field-menu { top: calc(100% + 6px); left: 0; right: auto; min-width: 100%; max-width: calc(100vw - 24px); max-height: min(60vh, 340px); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; visibility: hidden; transition: opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s; }
    .cg-field .cg-field-menu.-open { visibility: visible; transition-delay: 0s; }
    .cg-field .cg-field-menu.-right { left: auto; right: 0; }
    .cg-field .cg-field-menu .sort-row { justify-content: stretch; padding: 4px; }
    .cg-field .cg-field-menu .sort-choices { flex-direction: column; flex-wrap: nowrap; align-items: stretch; width: 100%; }
    .cg-field .cg-field-menu .sort-option { text-align: left; }
    .cg-menu-label { display: block; padding: 8px 9px 3px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #6f7c91; white-space: nowrap; }
    .cg-field-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cg-field-chevron { position: absolute; top: 50%; right: 9px; width: 13px; height: 13px; margin-top: -6.5px; fill: none; stroke: #8490a4; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; transition: stroke 0.15s ease, transform 0.15s ease; }
    .cg-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; min-height: 22px; }
    .cg-link { padding: 0; border: 0; background: none; color: #8490a4; font: inherit; font-size: 12.5px; cursor: pointer; transition: color 0.15s ease; }
    .cg-link:hover { color: #fff; }
    .cg-link[hidden] { display: none; }
    .cg-status { display: flex; align-items: center; justify-content: center; gap: 10px; color: #8490a4; font-size: 13px; padding: 48px 0; }
    .cg-status.-error { color: #fff; }
    .cg-status[hidden] { display: none; }
    .cg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px 10px; margin-top: 20px; }
    .cg-card { display: flex; flex-direction: column; min-width: 0; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    .cg-poster { position: relative; display: block; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden; background-color: #191f29; }
    .cg-poster img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
    .cg-initials { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #505a6b; }
    .cg-card-title { margin-top: 8px; font-size: 12.5px; font-weight: 600; line-height: 1.3; color: #dde2eb; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: color 0.15s ease; }
    .cg-card-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 11px; color: #8490a4; }
    .cg-rating { display: inline-flex; align-items: center; gap: 4px; color: #8490a4; }
    .cg-rating svg { width: 10px; height: 10px; fill: #fff; flex: none; }
    .cg-sentinel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 64px; margin-top: 8px; color: #8490a4; font-size: 12.5px; text-align: center; }
    .cg-sentinel[hidden], #cg-loader[hidden], #cg-note[hidden] { display: none; }
    #cg-loader { display: flex; justify-content: center; }
    @media (hover: hover) and (pointer: fine) {
      .cg-card:hover .cg-card-title { color: #fff; }
    }
    @media (min-width: 600px) {
      .cg-bar { display: flex; flex-wrap: wrap; gap: 8px; }
      .cg-bar .cg-field { width: auto; flex: 0 1 148px; }
      .cg-extra { display: flex; flex-wrap: wrap; gap: 8px; }
      .cg-extra .cg-field { width: auto; flex: 0 1 148px; }
      .cg-actions { grid-column: auto; margin-left: 4px; }
      .cg-grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 20px 12px; }
    }
    @media (min-width: 700px) {
      .cg-title { font-size: 1.45rem; }
      .cg-card-title { font-size: 13px; }
    }
    @media (min-width: 1024px) {
      .cg-grid { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 22px 14px; }
    }
  </style>
