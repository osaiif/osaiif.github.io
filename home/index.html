<script>
(function () {
var btn = document.querySelector('.footer-email-btn');
if (!btn) return;
function fallbackCopy(text) {
var ta = document.createElement('textarea');
ta.value = text;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.focus();
ta.select();
try { document.execCommand('copy'); } catch (e) {}
document.body.removeChild(ta);
}
function showCopied() {
btn.classList.remove('-copied');
void btn.offsetWidth;
btn.classList.add('-copied');
clearTimeout(btn._copiedTimeout);
btn._copiedTimeout = setTimeout(function () {
btn.classList.remove('-copied');
}, 1400);
}
btn.addEventListener('click', function () {
var email = btn.getAttribute('data-email');
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(email).then(showCopied).catch(function () {
fallbackCopy(email);
showCopied();
});
} else {
fallbackCopy(email);
showCopied();
}
});
})();
</script>

            items = items.slice(0, 10);
            if (!items.length) {
              section.remove();
              return;
            }
            items.forEach(function (item) {
              track.appendChild(window.tvboxNews.buildCard(item, window.tvboxNews.articleUrl(item)));
            });
            section.hidden = false;
            window.tvboxNews.addNav(track);
            observeReveal(section);
          })
          .catch(function (err) {
            console.error('News failed to load:', err);
            section.remove();
          });
      }
      function buildPills(rowDef) {
        var section = document.createElement('section');
        section.className = 'discover-row';
        var heading = document.createElement('h2');
        heading.className = 'section-heading';
        heading.textContent = rowDef.title;
        section.appendChild(heading);
        var strip = document.createElement('div');
        strip.className = 'pill-strip';
        var all = document.createElement('a');
        all.className = 'pill';
        all.href = '/g/?s=all';
        all.textContent = 'All';
        strip.appendChild(all);
        PILL_GENRES.forEach(function (genre) {
          var a = document.createElement('a');
          a.className = 'pill';
          a.href = genreLink(genre);
          a.textContent = genre.name;
          strip.appendChild(a);
        });
        section.appendChild(strip);
        rowsMount.appendChild(section);
        observeReveal(section);
      }
      function buildPick(rowDef) {
        var section = document.createElement('section');
        section.className = 'discover-row';
        var heading = document.createElement('h2');
        heading.className = 'section-heading';
        heading.textContent = rowDef.title;
        section.appendChild(heading);
        var card = document.createElement('div');
        card.className = 'pick -loading';
        card.innerHTML =
          '<a class="pick-poster" href="/show/"></a>' +
          '<div class="pick-body">' +
            '<a class="pick-title" href="/show/"></a>' +
            '<div class="pick-meta"></div>' +
            '<p class="pick-genres"></p>' +
            '<p class="pick-overview"></p>' +
            '<div class="pick-actions">' +
              '<a class="hero-cta" href="/show/"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>View show</span></a>' +
              '<button type="button" class="pill">Shuffle</button>' +
            '</div>' +
          '</div>';
        section.appendChild(card);
        rowsMount.appendChild(section);
        observeReveal(section);
        var posterEl = card.querySelector('.pick-poster');
        var titleEl = card.querySelector('.pick-title');
        var metaEl = card.querySelector('.pick-meta');
        var genresEl = card.querySelector('.pick-genres');
        var overviewEl = card.querySelector('.pick-overview');
        var ctaEl = card.querySelector('.hero-cta');
        var shuffleEl = card.querySelector('.pill');
        var pool = [];
        var index = 0;
        var busy = false;
        function render(i) {
          var show = pool[i];
          var href = '/show/?id=' + show.id;
          posterEl.href = href;
          titleEl.href = href;
          ctaEl.href = href;
          titleEl.textContent = show.name;
          overviewEl.textContent = show.overview;
          posterEl.setAttribute('aria-label', show.name);
          posterEl.innerHTML = '';
          var img = document.createElement('img');
          img.alt = show.name;
          img.width = 120;
          img.height = 180;
          img.decoding = 'async';
          img.src = POSTER_BASE + show.poster_path;
          posterEl.appendChild(img);
          var parts = [];
          if (show.vote_average) parts.push(STAR_SVG + '<span>' + (show.vote_average / 2).toFixed(1) + '</span>');
          var year = yearFromDate(show.first_air_date);
          if (year) parts.push('<span>' + year + '</span>');
          var names = (show.genre_ids || []).map(function (id) { return GENRE_NAMES[id]; }).filter(Boolean).slice(0, 2);
          genresEl.textContent = names.join(', ');
          genresEl.hidden = !names.length;
          metaEl.innerHTML = parts.join('<span class="hero-meta-dot">·</span>');
          return img;
        }
        lazyLoad(section, function () {
          fetchTmdb('/tv/top_rated', 'page=' + (1 + Math.floor(Math.random() * 5))).then(function (shows) {
            pool = shuffleList(filterRow(GRID_FILTER, shows).filter(function (s) { return !!s.overview; }));
            if (pool.length < 2) {
              section.remove();
              return;
            }
            render(0);
            card.classList.remove('-loading');
          }).catch(function (err) {
            console.error('Surprise Me failed to load:', err);
            section.remove();
          });
        });
        shuffleEl.addEventListener('click', function () {
          if (busy || pool.length < 2) return;
          busy = true;
          card.classList.add('-fading');
          window.setTimeout(function () {
            index = (index + 1) % pool.length;
            var img = render(index);
            var revealed = false;
            function reveal() {
              if (revealed) return;
              revealed = true;
              card.classList.remove('-fading');
              busy = false;
            }
            if (img.complete) {
              reveal();
            } else {
              img.addEventListener('load', reveal);
              img.addEventListener('error', reveal);
              window.setTimeout(reveal, 900);
            }
          }, 200);
        });
      }
      function buildGuide(rowDef) {
        var refs = buildSkeletonRow(rowDef.title);
        var tabs = document.createElement('div');
        tabs.className = 'pill-strip -tabs';
        refs.section.insertBefore(tabs, refs.wrap);
        var buttons = [];
        var current = 0;
        var requestSeq = 0;
        function dayLabel(n) {
          if (n === 0) return 'Today';
          if (n === 1) return 'Tomorrow';
          var d = new Date();
          d.setDate(d.getDate() + n);
          return d.toLocaleDateString('en-US', { weekday: 'short' });
        }
        function select(n) {
          current = n;
          buttons.forEach(function (b, idx) {
            b.classList.toggle('-active', idx === n);
            b.setAttribute('aria-pressed', idx === n ? 'true' : 'false');
          });
          var seq = ++requestSeq;
          fillSkeleton(refs);
          var day = isoDate(n);
          fetchTmdb(discoverPath('sort_by=popularity.desc&air_date.gte=' + day + '&air_date.lte=' + day)).then(function (shows) {
            if (seq !== requestSeq) return;
            shows = filterRow(GRID_FILTER, uniqueShows(shows));
            if (!shows.length) {
              showEmpty(refs, 'Nothing listed for this day');
              return;
            }
            fillRow(rowDef, shows, refs);
          }).catch(function (err) {
            if (seq !== requestSeq) return;
            console.error('TV Guide failed to load:', err);
            showEmpty(refs, 'Could not load this day');
          });
        }
        for (var i = 0; i < 7; i++) {
          (function (n) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'pill';
            b.textContent = dayLabel(n);
            b.addEventListener('click', function () {
              if (n !== current) select(n);
            });
            tabs.appendChild(b);
            buttons.push(b);
          })(i);
        }
        buttons[0].classList.add('-active');
        buttons[0].setAttribute('aria-pressed', 'true');
        lazyLoad(refs.section, function () { select(0); });
      }
      ROWS.forEach(function (rowDef) {
        if (rowDef.news) {
          buildNewsRow(rowDef);
          return;
        }
        if (rowDef.pills) {
          buildPills(rowDef);
          return;
        }
        if (rowDef.pick) {
          buildPick(rowDef);
          return;
        }
        if (rowDef.guide) {
          buildGuide(rowDef);
          return;
        }
        var refs = buildSkeletonRow(rowDef.title, rowDef.link);
        lazyLoad(refs.section, function () {
          if (rowDef.source) {
            loadSourceRow(rowDef, refs);
          } else {
            loadPathRow(rowDef, refs);
          }
        });
      });
    })();
  </script>
<script src="/js/auth.js?v=1"></script>
