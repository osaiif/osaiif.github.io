<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>List editor</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
<style>
:root{--bg:#14181c;--panel:#1c2228;--line:#2c3440;--text:#e8edf2;--muted:#9ab;--accent:#00c030;--bad:#ff6b6b}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
h2{font-size:15px;margin:0 0 10px}
main{max-width:960px;margin:0 auto;padding:16px;display:grid;gap:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;color:var(--text);background:#0e1216;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{cursor:pointer;background:var(--panel)}
button:hover{border-color:var(--muted)}
button.on,button.primary{background:var(--accent);border-color:var(--accent);color:#04140a;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:flex-end}
.row>input,.row>.grow{flex:1 1 160px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label input,label select{width:100%}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:#171c21}
.card .row:last-child{margin-bottom:0}
.card input[data-f=title]{font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.chips input{flex:1 1 180px}
.errors{color:var(--bad);margin:0 0 10px;padding-left:18px}
.errors:empty{display:none}
#outText{width:100%;min-height:200px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
a{color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.warn{color:#f5c542;font-size:13px}
.lock{max-width:460px;margin:30px auto 0}
.lock form{display:grid;gap:10px}
.lock ol{margin:0 0 6px;padding-left:20px;color:var(--muted);font-size:13px}
.lock input{width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:#04140a;padding:8px 16px;border-radius:20px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
details{margin-top:12px}
code{background:#0e1216;padding:1px 5px;border-radius:4px}
.sticky{position:sticky;bottom:0;z-index:5}
</style>
</head>
<body>
<header>
<h1>List editor</h1>
<nav id="tabs" hidden></nav>
</header>
<main>
<section class="panel lock" id="lock"></section>
<div id="app" hidden style="display:grid;gap:16px">
<div class="panel"><span id="status" class="muted">Loading...</span></div>
<section class="panel" id="editor"></section>
<section class="panel sticky" id="savebar">
<ul class="errors" id="errors"></ul>
<div class="actions">
<button id="saveBtn" class="primary" disabled>Save</button>
<span id="saveNote" class="muted">No changes yet.</span>
<button id="lockBtn" style="margin-left:auto">Lock</button>
</div>
<details>
<summary class="muted">Preview file that will be saved</summary>
<textarea id="outText" readonly spellcheck="false"></textarea>
</details>
</section>
</div>
</main>
<div id="toast"></div>
<script>
(function () {
  var OWNER_REPO = 'osaiif/r';
  var API = 'https://api.github.com/repos/' + OWNER_REPO + '/contents/';
  var TMDB_KEY = '6cb6e1dc603bc65ffb6198489d5bc5b7';
  var VAULT = 'listEditorVault';
  var META = {
    shows: { file: 't.js', global: 'SHOWS', label: 'Shows' },
    favs: { file: 'favs.js', global: 'FAVORITES', label: 'Favorites' },
    bio: { file: 'bio.js', global: 'PROFILE_BIO', label: 'Bio' }
  };
  var KEYS = ['shows', 'favs', 'bio'];
  var LISTS = [['', 'Watched'], ['watchlist', 'Watchlist'], ['dnf', 'DNF']];
  var RATINGS = ['', '0.5', '1', '1.5', '2', '2.5', '3', '3.5', '4', '4.5', '5'];
  var state = { shows: [], favs: [], bio: '', loaded: {}, sha: {}, note: {}, dirty: {} };
  var token = '';
  var tab = 'shows';
  var filter = 'all';
  var query = '';
  var saving = false;
  var toastTimer = 0;
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function b64(buf) {
    var b = new Uint8Array(buf);
    var s = '';
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  }
  function unb64(s) {
    var r = atob(s);
    var a = new Uint8Array(r.length);
    for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i);
    return a;
  }
  function deriveKey(pin, salt) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 310000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  function seal(tok, pin) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(pin, salt).then(function (key) {
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(tok));
    }).then(function (ct) {
      localStorage.setItem(VAULT, JSON.stringify({ s: b64(salt), i: b64(iv), c: b64(ct) }));
    });
  }
  function unseal(pin) {
    var v = JSON.parse(localStorage.getItem(VAULT));
    return deriveKey(pin, unb64(v.s)).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(v.i) }, key, unb64(v.c));
    }).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function hasVault() {
    try { return !!localStorage.getItem(VAULT); } catch (e) { return false; }
  }
  function authHeaders(extra) {
    var h = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
    for (var k in extra) h[k] = extra[k];
    return h;
  }
  function apiError(r, j) {
    var m = (j && j.message) || '';
    if (r.status === 401) return 'GitHub rejected the token (expired or wrong). Reset this device and enter a new token.';
    if (r.status === 403 || r.status === 404) return 'The token cannot access the r repo with Contents read and write permission. ' + m;
    if (r.status === 409 || r.status === 422) return 'The file changed on GitHub since you opened it. Press Reload and redo your change. Nothing was overwritten.';
    return 'GitHub error ' + r.status + '. ' + m;
  }
  function ghGet(file, tok) {
    var t = tok || token;
    return fetch(API + file + '?ref=main', { headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' }, cache: 'no-store' }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(apiError(r, j));
        return { text: new TextDecoder().decode(unb64(j.content)), sha: j.sha };
      });
    });
  }
  function normShow(s) {
    return {
      title: String(s.title || ''),
      imdb: String(s.imdb || ''),
      src: String(s.src || ''),
      rating: s.rating == null ? '' : String(s.rating),
      list: s.list || '',
      journalYear: s.journalYear == null ? '' : String(s.journalYear),
      journalOrder: s.journalOrder == null ? '' : String(s.journalOrder),
      seasons: Array.isArray(s.seasons) ? s.seasons.join(',') : ''
    };
  }
  function ingest(key, text) {
    var g = META[key].global;
    var data = new Function('window', text + '\n;return (typeof ' + g + ' !== "undefined") ? ' + g + ' : window.' + g + ';')({});
    if (key === 'shows') {
      if (!Array.isArray(data) || !data.length) throw new Error('No shows found in file');
      state.shows = data.map(normShow);
    } else if (key === 'favs') {
      if (!Array.isArray(data)) throw new Error('No favorites found in file');
      state.favs = data.map(function (f) {
        return { title: String(f.title || ''), imdb: String(f.imdb || ''), img: String(f.img || '') };
      });
    } else {
      if (typeof data !== 'string') throw new Error('No bio found in file');
      state.bio = data;
    }
  }
  function load(key) {
    return ghGet(META[key].file).then(function (res) {
      ingest(key, res.text);
      state.sha[key] = res.sha;
      state.loaded[key] = true;
      state.dirty[key] = false;
      state.note[key] = 'Loaded live from GitHub.';
    }).catch(function (e) {
      state.loaded[key] = false;
      state.note[key] = 'Could not load ' + META[key].file + ': ' + e.message;
    });
  }
  function anyDirty() { return KEYS.some(function (k) { return state.dirty[k]; }); }
  function drawTabs() {
    $('tabs').innerHTML = KEYS.map(function (k) {
      return '<button data-tab="' + k + '" class="' + (k === tab ? 'on' : '') + '">' + META[k].label + (state.dirty[k] ? ' *' : '') + '</button>';
    }).join('');
  }
  function showsSkeleton() {
    return '<div class="row"><h2 style="flex:1 1 auto;margin:0">Shows</h2><button data-act="reload">Reload</button></div>' +
      '<div class="chips" id="chips"></div>' +
      '<div class="panel" style="margin-bottom:12px"><h2>Search and add</h2>' +
      '<div class="row"><input id="qs" placeholder="Search a show or movie..." autocomplete="off"></div>' +
      '<div id="qsRes"></div>' +
      '<div class="muted">Click a list button and it is added and saved right away.</div>' +
      '<details><summary class="muted">Add by IMDb id instead</summary>' +
      '<div class="row" style="margin-top:8px"><input id="addImdb" placeholder="IMDb id, e.g. tt1234567"><button data-act="fetchTitle">Fetch title</button></div>' +
      '<div class="row"><input id="addTitle" placeholder="Title"><select id="addList">' +
      LISTS.map(function (l) { return '<option value="' + l[0] + '">' + l[1] + '</option>'; }).join('') +
      '</select><button class="primary" data-act="addShow">Add</button></div></details></div>' +
      '<div id="cards"></div>';
  }
  function drawChips() {
    var counts = { all: state.shows.length, '': 0, watchlist: 0, dnf: 0 };
    state.shows.forEach(function (s) { counts[s.list] = (counts[s.list] || 0) + 1; });
    var defs = [['all', 'All'], ['', 'Watched'], ['watchlist', 'Watchlist'], ['dnf', 'DNF']];
    $('chips').innerHTML = defs.map(function (d) {
      return '<button data-filter="' + d[0] + '" class="' + (filter === d[0] ? 'on' : '') + '">' + d[1] + ' (' + (counts[d[0]] || 0) + ')</button>';
    }).join('') + '<input id="search" placeholder="Search title or id" value="' + esc(query) + '">';
  }
  function showCard(s, i) {
    return '<div class="card" data-i="' + i + '">' +
      '<div class="row"><input data-f="title" value="' + esc(s.title) + '" aria-label="Title"><input data-f="imdb" value="' + esc(s.imdb) + '" style="flex:0 1 150px" aria-label="IMDb id"></div>' +
      '<div class="row">' +
      '<label>List<select data-f="list">' + LISTS.map(function (l) {
        return '<option value="' + l[0] + '"' + (l[0] === s.list ? ' selected' : '') + '>' + l[1] + '</option>';
      }).join('') + '</select></label>' +
      '<label>Rating<select data-f="rating">' + RATINGS.map(function (r) {
        return '<option value="' + r + '"' + (r === s.rating ? ' selected' : '') + '>' + (r === '' ? 'none' : r) + '</option>';
      }).join('') + '</select></label>' +
      '<label>Journal year<input data-f="journalYear" inputmode="numeric" value="' + esc(s.journalYear) + '"></label>' +
      '<label>Journal order<input data-f="journalOrder" inputmode="numeric" value="' + esc(s.journalOrder) + '"></label>' +
      '<label>Seasons<input data-f="seasons" placeholder="e.g. 1,2" value="' + esc(s.seasons) + '"></label></div>' +
      '<div class="row"><label class="grow">Poster URL (optional)<input data-f="src" value="' + esc(s.src) + '"></label><button data-act="del">Delete</button></div>' +
      '</div>';
  }
  function drawCards() {
    var q = query.trim().toLowerCase();
    var html = '';
    state.shows.forEach(function (s, i) {
      if (filter !== 'all' && s.list !== filter) return;
      if (q && (s.title + ' ' + s.imdb).toLowerCase().indexOf(q) === -1) return;
      html += showCard(s, i);
    });
    $('cards').innerHTML = html || '<div class="muted">Nothing here.</div>';
  }
  function favsSkeleton() {
    return '<div class="row"><h2 style="flex:1 1 auto;margin:0">Favorites</h2><button data-act="reload">Reload</button></div>' +
      '<div class="warn" style="margin-bottom:10px">Each image file must already exist in the r repo with exactly the name you type. <a href="https://github.com/' + OWNER_REPO + '/upload/main" target="_blank" rel="noopener">Upload images</a></div>' +
      '<div class="panel" style="margin-bottom:12px"><h2>Add a favorite</h2><div class="row"><input id="fTitle" placeholder="Title"><input id="fImdb" placeholder="tt1234567"><input id="fImg" placeholder="image.webp"><button class="primary" data-act="addFav">Add</button></div></div>' +
      '<div id="cards"></div>';
  }
  function drawFavs() {
    $('cards').innerHTML = state.favs.map(function (f, i) {
      return '<div class="card" data-i="' + i + '"><div class="row"><input data-f="title" value="' + esc(f.title) + '" aria-label="Title"><input data-f="imdb" value="' + esc(f.imdb) + '" aria-label="IMDb id"><input data-f="img" value="' + esc(f.img) + '" aria-label="Image file"></div>' +
        '<div class="row"><button data-act="up"' + (i === 0 ? ' disabled' : '') + '>Move up</button><button data-act="down"' + (i === state.favs.length - 1 ? ' disabled' : '') + '>Move down</button><button data-act="del">Delete</button></div></div>';
    }).join('') || '<div class="muted">No favorites.</div>';
  }
  function bioSkeleton() {
    return '<div class="row"><h2 style="flex:1 1 auto;margin:0">Bio</h2><button data-act="reload">Reload</button></div>' +
      '<label>Bio (HTML allowed)<textarea id="bioBox" rows="6" spellcheck="false">' + esc(state.bio) + '</textarea></label>';
  }
  function drawEditor() {
    var ed = $('editor');
    $('status').textContent = state.note[tab] || 'Loading...';
    $('status').style.color = (state.note[tab] && !state.loaded[tab]) ? 'var(--bad)' : '';
    if (!state.loaded[tab]) {
      ed.innerHTML = '<div class="row"><h2 style="flex:1 1 auto;margin:0">' + META[tab].label + '</h2><button data-act="reload">Try again</button></div><div class="muted">Editing is disabled until the current file loads, so nothing can be overwritten by mistake.</div>';
      return;
    }
    if (tab === 'shows') { ed.innerHTML = showsSkeleton(); drawChips(); drawCards(); }
    else if (tab === 'favs') { ed.innerHTML = favsSkeleton(); drawFavs(); }
    else { ed.innerHTML = bioSkeleton(); }
  }
  function validImdb(v) { return /^tt\d+$/.test(v); }
  function buildShows() {
    var errs = [];
    var seen = {};
    var orders = {};
    var lines = state.shows.map(function (s, i) {
      var title = s.title.trim();
      var imdb = s.imdb.trim();
      var src = s.src.trim();
      var y = s.journalYear.trim();
      var o = s.journalOrder.trim();
      var se = s.seasons.trim();
      var n = title || ('Row ' + (i + 1));
      var p = [];
      if (!title) errs.push('Row ' + (i + 1) + ': title is empty.');
      if (!validImdb(imdb)) errs.push(n + ': IMDb id must look like tt1234567.');
      else if (seen[imdb]) errs.push(n + ': duplicate IMDb id ' + imdb + '.');
      else seen[imdb] = 1;
      if (src && !/^https:\/\//.test(src)) errs.push(n + ': poster URL must be empty or start with https://');
      p.push('title: ' + JSON.stringify(title));
      p.push('imdb: ' + JSON.stringify(imdb));
      p.push('src: ' + JSON.stringify(src));
      p.push('rating: ' + (s.rating === '' ? 'null' : String(parseFloat(s.rating))));
      if (s.list) p.push('list: ' + JSON.stringify(s.list));
      if (y || o) {
        if (!/^(19|20)\d\d$/.test(y)) errs.push(n + ': journal year must be 4 digits (or clear both journal fields).');
        else if (!/^\d+$/.test(o)) errs.push(n + ': journal order must be a whole number (or clear both journal fields).');
        else {
          if (orders[o]) errs.push(n + ': journal order ' + o + ' is already used by ' + orders[o] + '.');
          else orders[o] = n;
          p.push('journalYear: ' + Number(y));
          p.push('journalOrder: ' + Number(o));
        }
      }
      if (se) {
        var parts = se.split(',').map(function (x) { return x.trim(); });
        var ok = parts.every(function (x) { return /^[1-9]\d*$/.test(x); });
        if (!ok) errs.push(n + ': seasons must be numbers separated by commas, e.g. 1,2.');
        else p.push('seasons: [' + parts.join(', ') + ']');
      }
      return '  { ' + p.join(', ') + ' }';
    });
    return { errs: errs, text: 'var SHOWS = [\n' + lines.join(',\n') + ',\n];\n' };
  }
  function buildFavs() {
    var errs = [];
    var lines = state.favs.map(function (f, i) {
      var title = f.title.trim();
      var imdb = f.imdb.trim();
      var img = f.img.trim();
      var n = title || ('Row ' + (i + 1));
      if (!title) errs.push('Row ' + (i + 1) + ': title is empty.');
      if (!validImdb(imdb)) errs.push(n + ': IMDb id must look like tt1234567.');
      if (!/^[A-Za-z0-9_.-]+\.(webp|png|jpg|jpeg)$/.test(img)) errs.push(n + ': image must be a file name like show.webp (no folders or spaces).');
      return '  { title: ' + JSON.stringify(title) + ', imdb: ' + JSON.stringify(imdb) + ', img: ' + JSON.stringify(img) + ' }';
    });
    return { errs: errs, text: 'window.FAVORITES = [\n' + lines.join(',\n') + '\n];\n' };
  }
  function buildBio() {
    var lines = state.bio.split(/\r?\n/).map(function (l) { return l.replace(/\s+$/, ''); }).filter(function (l) { return l.trim() !== ''; });
    var body = lines.join('\n').replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
    var errs = lines.length ? [] : ['Bio is empty.'];
    return { errs: errs, text: 'window.PROFILE_BIO = `' + body + '`;\n' };
  }
  function build(key) {
    return key === 'shows' ? buildShows() : key === 'favs' ? buildFavs() : buildBio();
  }
  function refresh() {
    var res = { errs: [], text: '' };
    if (state.loaded[tab]) res = build(tab);
    var bad = !state.loaded[tab] || res.errs.length > 0;
    $('errors').innerHTML = res.errs.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('');
    $('outText').value = bad ? '' : res.text;
    $('saveBtn').disabled = bad || !state.dirty[tab] || saving;
    if (!saving) $('saveNote').textContent = res.errs.length ? 'Fix the errors above to save.' : (state.dirty[tab] ? 'Unsaved changes.' : 'No changes yet.');
    drawTabs();
  }
  function render() { drawTabs(); drawEditor(); refresh(); }
  function markDirty() { state.dirty[tab] = true; refresh(); }
  function addShow() {
    var imdb = $('addImdb').value.trim();
    var title = $('addTitle').value.trim();
    var list = $('addList').value;
    if (!validImdb(imdb)) { toast('IMDb id must look like tt1234567'); return; }
    if (!title) { toast('Enter a title'); return; }
    if (state.shows.some(function (s) { return s.imdb.trim() === imdb; })) { toast('That IMDb id is already in the list'); return; }
    var item = normShow({ title: title, imdb: imdb, src: '', rating: null, list: list });
    var last = -1;
    state.shows.forEach(function (s, i) { if (!s.list) last = i; });
    if (list === '') state.shows.splice(last + 1, 0, item);
    else state.shows.push(item);
    filter = list === '' ? '' : list;
    query = '';
    $('addImdb').value = '';
    $('addTitle').value = '';
    drawChips();
    drawCards();
    markDirty();
    toast('Added. Press Save to publish.');
  }
  var qsTimer = 0;
  var qsSeq = 0;
  var qsItems = {};
  function qsSearch(q) {
    var box = $('qsRes');
    if (!box) return;
    q = q.trim();
    if (q.length < 2) { box.innerHTML = ''; return; }
    var seq = ++qsSeq;
    box.innerHTML = '<div class="muted">Searching...</div>';
    fetch('https://api.themoviedb.org/3/search/multi?include_adult=false&query=' + encodeURIComponent(q) + '&api_key=' + TMDB_KEY)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        if (seq !== qsSeq || !$('qsRes')) return;
        var res = (d.results || []).filter(function (x) { return x.media_type === 'tv' || x.media_type === 'movie'; }).slice(0, 8);
        qsItems = {};
        $('qsRes').innerHTML = res.map(function (x) {
          var key = x.media_type + x.id;
          var title = x.name || x.title || '';
          var year = (x.first_air_date || x.release_date || '').slice(0, 4);
          qsItems[key] = { type: x.media_type, id: x.id, title: title };
          var img = x.poster_path ? '<img src="https://image.tmdb.org/t/p/w92' + x.poster_path + '" alt="" style="width:46px;height:69px;object-fit:cover;border-radius:4px;flex:none">' : '<div style="width:46px;height:69px;background:#0e1216;border-radius:4px;flex:none"></div>';
          return '<div class="card" data-k="' + key + '" style="display:flex;gap:10px;align-items:center">' + img +
            '<div style="flex:1 1 auto;min-width:0"><div style="font-weight:600">' + esc(title) + '</div><div class="muted">' + (x.media_type === 'tv' ? 'TV' : 'Movie') + (year ? ' · ' + year : '') + '</div></div>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' +
            '<button data-act="qadd" data-list="watchlist">Watchlist</button><button data-act="qadd" data-list="">Watched</button><button data-act="qadd" data-list="dnf">DNF</button></div></div>';
        }).join('') || '<div class="muted">No results.</div>';
      })
      .catch(function () { if (seq === qsSeq && $('qsRes')) $('qsRes').innerHTML = '<div class="warn">Search failed. Try again.</div>'; });
  }
  function qsAdd(btn) {
    var row = btn.closest('[data-k]');
    var it = row && qsItems[row.dataset.k];
    if (!it || saving) { if (saving) toast('Saving, one moment'); return; }
    var list = btn.dataset.list;
    var all = row.querySelectorAll('button');
    for (var i = 0; i < all.length; i++) all[i].disabled = true;
    fetch('https://api.themoviedb.org/3/' + it.type + '/' + it.id + '/external_ids?api_key=' + TMDB_KEY)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        var imdb = d.imdb_id || '';
        if (!validImdb(imdb)) throw new Error('No IMDb id for this title on TMDB');
        var dup = state.shows.filter(function (s) { return s.imdb.trim() === imdb; })[0];
        if (dup) { toast('Already in your list: ' + (dup.list === 'watchlist' ? 'Watchlist' : dup.list === 'dnf' ? 'DNF' : 'Watched')); return; }
        var item = normShow({ title: it.title, imdb: imdb, src: '', rating: null, list: list });
        var last = -1;
        state.shows.forEach(function (s, idx) { if (!s.list) last = idx; });
        if (list === '') state.shows.splice(last + 1, 0, item);
        else state.shows.push(item);
        drawChips();
        drawCards();
        markDirty();
        toast('Adding ' + it.title + '...');
        save();
        row.style.opacity = '.5';
      })
      .catch(function (e) { toast(e.message); })
      .then(function () { if (row.style.opacity !== '.5') for (var i = 0; i < all.length; i++) all[i].disabled = false; });
  }
  function fetchTitle() {
    var imdb = $('addImdb').value.trim();
    if (!validImdb(imdb)) { toast('IMDb id must look like tt1234567'); return; }
    fetch('https://api.themoviedb.org/3/find/' + encodeURIComponent(imdb) + '?external_source=imdb_id&api_key=' + TMDB_KEY)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        var all = [].concat(d.tv_results || [], d.movie_results || []);
        var f = all[0];
        var name = f && (f.name || f.title);
        if (name) { $('addTitle').value = name; toast('Title filled'); }
        else toast('Not found, type the title yourself');
      })
      .catch(function () { toast('Lookup failed, type the title yourself'); });
  }
  function addFav() {
    var title = $('fTitle').value.trim();
    var imdb = $('fImdb').value.trim();
    var img = $('fImg').value.trim();
    if (!title || !validImdb(imdb) || !img) { toast('Fill title, IMDb id and image file'); return; }
    state.favs.push({ title: title, imdb: imdb, img: img });
    $('fTitle').value = '';
    $('fImdb').value = '';
    $('fImg').value = '';
    drawFavs();
    markDirty();
  }
  function save() {
    var key = tab;
    var res = build(key);
    if (res.errs.length || saving || !state.dirty[key]) return;
    saving = true;
    $('saveBtn').disabled = true;
    $('saveNote').textContent = 'Saving...';
    var file = META[key].file;
    fetch(API + file, {
      method: 'PUT',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ message: 'Update ' + file + ' via editor', content: b64(new TextEncoder().encode(res.text)), sha: state.sha[key], branch: 'main' })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(apiError(r, j));
        state.sha[key] = j.content.sha;
        state.dirty[key] = false;
        saving = false;
        refresh();
        $('saveNote').textContent = 'Saved. Your site updates in about 5 minutes.';
        toast('Saved');
      });
    }).catch(function (e) {
      saving = false;
      refresh();
      $('saveNote').textContent = 'Not saved: ' + e.message;
      $('saveNote').style.color = 'var(--bad)';
    });
  }
  function reload() {
    if (state.dirty[tab] && !confirm('You have unsaved edits. Reload from GitHub and discard them?')) return;
    var key = tab;
    $('status').textContent = 'Loading...';
    load(key).then(function () { if (tab === key) render(); });
  }
  function showLock() {
    $('app').hidden = true;
    $('tabs').hidden = true;
    $('lock').hidden = false;
    token = '';
    if (hasVault()) {
      $('lock').innerHTML = '<h2>Enter your PIN</h2><form id="unlockForm"><input id="pin" type="password" autocomplete="current-password" placeholder="PIN or password" autofocus><button class="primary" type="submit">Unlock</button><div id="lockMsg" class="warn"></div></form><details><summary class="muted">Forgot PIN or new token</summary><p class="muted">This removes the saved token from this device only. You will set it up again.</p><button id="resetBtn">Reset this device</button></details>';
    } else {
      $('lock').innerHTML = '<h2>One-time setup on this device</h2><ol><li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub new fine-grained token</a>.</li><li>Repository access: Only select repositories, then choose <code>r</code>.</li><li>Permissions, Repository: Contents = Read and write.</li><li>Pick the longest expiration, then Generate and copy the token.</li></ol><form id="setupForm"><input id="tok" type="password" autocomplete="off" placeholder="Paste token"><input id="pin1" type="password" autocomplete="new-password" placeholder="Choose a PIN or password (6+ characters)"><input id="pin2" type="password" autocomplete="new-password" placeholder="Repeat it"><button class="primary" type="submit">Save and unlock</button><div id="lockMsg" class="warn"></div></form><p class="muted">The token is encrypted with your PIN and stored only in this browser. It is never sent anywhere except GitHub.</p>';
    }
  }
  function enter(tok) {
    token = tok;
    $('lock').hidden = true;
    $('app').hidden = false;
    $('tabs').hidden = false;
    state.loaded = {};
    state.dirty = {};
    state.note = {};
    render();
    Promise.all(KEYS.map(load)).then(render);
  }
  function lockMsg(m) { $('lockMsg').textContent = m; }
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'unlockForm') {
      lockMsg('Checking...');
      unseal($('pin').value).then(enter, function () { lockMsg('Wrong PIN.'); });
    } else if (e.target.id === 'setupForm') {
      var tok = $('tok').value.trim();
      var p1 = $('pin1').value;
      var p2 = $('pin2').value;
      if (!tok) { lockMsg('Paste the token.'); return; }
      if (p1.length < 6) { lockMsg('PIN must be at least 6 characters.'); return; }
      if (p1 !== p2) { lockMsg('The two PINs do not match.'); return; }
      if (!window.crypto || !crypto.subtle) { lockMsg('This browser cannot encrypt here. Open the page over https.'); return; }
      lockMsg('Checking token with GitHub...');
      ghGet('t.js', tok).then(function () {
        return fetch(API + 't.js', { method: 'PUT', headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: '{}' }).then(function (r) {
          if (r.status === 403 || r.status === 401 || r.status === 404) throw new Error('Token has no write access to the r repo. Set Contents to Read and write.');
        });
      }).then(function () {
        return seal(tok, p1);
      }).then(function () { enter(tok); }, function (err) { lockMsg(err.message); });
    }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'resetBtn') {
      if (!confirm('Remove the saved token from this device?')) return;
      try { localStorage.removeItem(VAULT); } catch (x) {}
      showLock();
      return;
    }
    if (b.id === 'lockBtn') {
      if (anyDirty() && !confirm('You have unsaved edits. Lock and discard them?')) return;
      state.dirty = {};
      showLock();
      return;
    }
    if (b.id === 'saveBtn') { save(); return; }
    if (b.dataset.tab) { tab = b.dataset.tab; $('saveNote').style.color = ''; render(); return; }
    if (b.dataset.filter !== undefined) { filter = b.dataset.filter; drawChips(); drawCards(); return; }
    var act = b.dataset.act;
    if (!act) return;
    var card = b.closest('.card');
    var i = card ? Number(card.dataset.i) : -1;
    if (act === 'reload') reload();
    else if (act === 'addShow') addShow();
    else if (act === 'fetchTitle') fetchTitle();
    else if (act === 'qadd') qsAdd(b);
    else if (act === 'addFav') addFav();
    else if (act === 'del') {
      var arr = tab === 'shows' ? state.shows : state.favs;
      var name = arr[i].title || 'this entry';
      if (!confirm('Delete "' + name + '"?')) return;
      arr.splice(i, 1);
      if (tab === 'shows') { drawChips(); drawCards(); } else drawFavs();
      markDirty();
    } else if (act === 'up' || act === 'down') {
      var j = act === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= state.favs.length) return;
      var tmp = state.favs[i];
      state.favs[i] = state.favs[j];
      state.favs[j] = tmp;
      drawFavs();
      markDirty();
    }
  });
  function onEdit(e) {
    var t = e.target;
    if (t.id === 'search') { query = t.value; drawCards(); return; }
    if (t.id === 'qs') { clearTimeout(qsTimer); var v = t.value; qsTimer = setTimeout(function () { qsSearch(v); }, 300); return; }
    if (t.id === 'bioBox') { state.bio = t.value; markDirty(); return; }
    var f = t.dataset && t.dataset.f;
    var card = t.closest && t.closest('.card');
    if (!f || !card) return;
    var i = Number(card.dataset.i);
    var arr = tab === 'shows' ? state.shows : state.favs;
    if (!arr[i]) return;
    arr[i][f] = t.value;
    if (f === 'list' && e.type === 'change') { drawChips(); drawCards(); }
    markDirty();
  }
  $('editor').addEventListener('input', onEdit);
  $('editor').addEventListener('change', onEdit);
  window.addEventListener('beforeunload', function (e) {
    if (anyDirty()) { e.preventDefault(); e.returnValue = ''; }
  });
  showLock();
})();
</script>
</body>
</html>
