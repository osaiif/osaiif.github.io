<script>
(function () {
var btn = document.querySelector('.footer-email-btn');
if (!btn) return;
function fallbackCopy(text) {
var ta = document.createElement('textarea');
ta.value = text;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.focus();
ta.select();
try { document.execCommand('copy'); } catch (e) {}
document.body.removeChild(ta);
}
function showCopied() {
btn.classList.remove('-copied');
void btn.offsetWidth;
btn.classList.add('-copied');
clearTimeout(btn._copiedTimeout);
btn._copiedTimeout = setTimeout(function () {
btn.classList.remove('-copied');
}, 1400);
}
btn.addEventListener('click', function () {
var email = btn.getAttribute('data-email');
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(email).then(showCopied).catch(function () {
fallbackCopy(email);
showCopied();
});
} else {
fallbackCopy(email);
showCopied();
}
});
})();
</script>

  <script>

      function renderMiniGrid(gridId, listKey) {
        var grid = document.getElementById(gridId);

        var shows = SHOWS.filter(function (s) { return s.list === listKey; }).slice(0, 4);

  <script>
    (function () {
      function starGlyph(v) {
        var full = Math.floor(v);
        var half = (v - full) >= 0.5;
        return '\u2605'.repeat(full) + (half ? '\u00BD' : '');
      }
      var section = document.getElementById('last-watched-section');
      var linkEl = document.getElementById('last-watched-link');
      var imgEl = document.getElementById('last-watched-img');
      var ratingEl = document.getElementById('last-watched-rating');
      if (!section || !linkEl || !imgEl) return;
      var journaled = SHOWS.filter(function (s) { return !!s.journalYear; });
      if (!journaled.length) return;
      var currentYear = new Date().getFullYear();
      var thisYear = journaled.filter(function (s) { return s.journalYear === currentYear; });
      var pool = thisYear.length ? thisYear : journaled;
      var lastWatched = pool.reduce(function (latest, s) {
        return (!latest || s.journalOrder > latest.journalOrder) ? s : latest;
      }, null);
      if (!lastWatched) return;
      linkEl.href = '/show/?imdb=' + lastWatched.imdb;
      imgEl.src = lastWatched.src;
      imgEl.alt = lastWatched.title || '';
      if (ratingEl && lastWatched.rating != null) {
        ratingEl.innerHTML = '<a href="/u/saif/rating/?stars=' + lastWatched.rating + '" class="rating-link">' + starGlyph(lastWatched.rating) + '</a>';
      }
      section.hidden = false;
    })();
  </script>
  <script>
    (function () {
      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }
      var journaled = SHOWS.filter(function (s) { return !!s.journalYear; })
        .sort(function (a, b) { return b.journalOrder - a.journalOrder; });
      var currentYear = new Date().getFullYear();
      var yearsWithEntries = [];
      journaled.forEach(function (s) {
        if (yearsWithEntries.indexOf(s.journalYear) === -1) yearsWithEntries.push(s.journalYear);
      });
      yearsWithEntries.sort(function (a, b) { return b - a; });
      var yearCountEl = document.getElementById('journal-year-count');
      var yearTextEl = document.getElementById('journal-year-text');
      var listEl = document.getElementById('journal-entry-list');
      var yearLinkEl = document.getElementById('journal-year-link');
      var yearTextPrevEl = document.getElementById('journal-year-text-prev');
      var listPrevEl = document.getElementById('journal-entry-list-prev');
      var yearLinkPrevEl = document.getElementById('journal-year-link-prev');
      var prevBlockEl = document.getElementById('journal-prev-block');
      var dividerEl = document.getElementById('journal-year-divider');
      function renderYear(year, textEl, listTarget, linkEl) {
        var items = journaled.filter(function (s) { return s.journalYear === year; });
        textEl.textContent = year;
        linkEl.href = '/u/saif/journal/?year=' + year;
        linkEl.setAttribute('aria-label', 'View ' + year + ' journal');
        listTarget.innerHTML = items.slice(0, 2).map(function (s) {
          return '<li><a href="/show/?imdb=' + s.imdb + '" class="entry-title">' + escapeHtml(s.title) + '</a></li>';
        }).join('');
      }
      if (yearCountEl) {
        yearCountEl.textContent = journaled.filter(function (s) { return s.journalYear === currentYear; }).length;
      }
      if (yearsWithEntries.length) {
        renderYear(yearsWithEntries[0], yearTextEl, listEl, yearLinkEl);
      }
      if (yearsWithEntries.length > 1) {
        renderYear(yearsWithEntries[1], yearTextPrevEl, listPrevEl, yearLinkPrevEl);
      } else {
        if (prevBlockEl) prevBlockEl.style.display = 'none';
        if (dividerEl) dividerEl.style.display = 'none';
      }
    })();
  </script>
  <script>
    (function () {
      var RATING_STEPS = [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];
      var counts = {};
      RATING_STEPS.forEach(function (r) { counts[r] = 0; });
      SHOWS.forEach(function (s) {
        if (s.rating && counts.hasOwnProperty(s.rating)) {
          counts[s.rating]++;
        }
      });
      var maxCount = Math.max.apply(null, RATING_STEPS.map(function (r) { return counts[r]; }));
      var bars = document.querySelectorAll('#ratings-bars .rbar');
      Array.prototype.forEach.call(bars, function (bar) {
        var r = parseFloat(bar.dataset.rating);
        var count = counts[r] || 0;
        var pct = maxCount > 0 ? Math.round((count / maxCount) * 100) : 0;
        bar.style.height = pct + '%';
        bar.title = r + '★ · ' + count;
      });
    })();
  </script>
  <script>
    (function () {
      var form = document.getElementById('home-search-form');
      var input = document.getElementById('home-search-input');
      var overlay = document.getElementById('page-loading-overlay');
      function goToResults() {
        var value = input.value.trim();
        if (!value) return;
        overlay.classList.add('-visible');
        window.location.href = '/search/?q=' + encodeURIComponent(value);
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        goToResults();
      });
      input.addEventListener('search', function () {
        goToResults();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          goToResults();
        }
      });
      window.addEventListener('pageshow', function () {
        overlay.classList.remove('-visible');
      });
    })();

  <script>
    (function () {
      var trigger = document.getElementById('avatar-trigger');
      var lightbox = document.getElementById('avatar-lightbox');
      var lightboxImg = document.getElementById('avatar-lightbox-img');
      function openLightbox() {
        lightboxImg.src = trigger.src;
        lightbox.classList.add('-visible');
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        lightbox.classList.remove('-visible');
        document.body.style.overflow = '';
      }
      trigger.addEventListener('click', openLightbox);
      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox();
        }
      });
      lightbox.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLightbox();
      });
      function closeOnScrollAttempt() {
        if (lightbox.classList.contains('-visible')) closeLightbox();
      }
      window.addEventListener('wheel', closeOnScrollAttempt, { passive: true });
      window.addEventListener('touchmove', closeOnScrollAttempt, { passive: true });
      window.addEventListener('scroll', closeOnScrollAttempt, { passive: true });
    })();
  </script>
  <script>
    (function () {
      var wrapper = document.getElementById('backdrop');
      if (!wrapper) return;
      var image = wrapper.querySelector('.js-backdrop-image');
      var isRetina = window.devicePixelRatio > 1;
      var isMobile = window.matchMedia('(max-width: 600px)').matches;
      var url = wrapper.dataset.backdrop;
      if (isMobile && wrapper.dataset.backdropMobile) {
        url = wrapper.dataset.backdropMobile;
      } else if (isRetina && wrapper.dataset.backdrop2x) {
        url = wrapper.dataset.backdrop2x;
      }
      if (!url || url.indexOf('PASTE_') === 0) return;
      var offset = wrapper.dataset.offset;
      if (offset) {
        image.style.backgroundPosition = 'center ' + offset + '%';
      }
      var preload = new Image();
      preload.onload = function () {
        image.style.backgroundImage = 'url("' + url + '")';
        image.classList.add('is-loaded');
      };
      preload.src = url;
    })();
  </script>
