    .site-header { position: relative; height: 52px; background-color: #0b121e; }

    .stx-title { margin: 0; font-size: 1.5rem; line-height: 1.15; color: #fff; display: flex; align-items: baseline; gap: 9px; }
    .stx-title .numbers { color: #fff; font-weight: 500; }

    .stx-title-row .stx-title { flex: 1; min-width: 0; }
    .year-trigger { width: auto; min-width: 28px; padding: 0 8px; font-family: var(--font-numbers); font-size: 13px; letter-spacing: 0.03em; line-height: 1; color: #b3c2db; white-space: nowrap; }

    .year-menu { min-width: 72px; max-width: none; width: max-content; max-height: min(60vh, 320px); overflow-y: auto; overscroll-behavior: contain; }
    .year-menu .sort-row { justify-content: stretch; padding: 4px; }
    .year-menu .sort-choices { flex-direction: column; flex-wrap: nowrap; align-items: stretch; width: 100%; }
    .year-option { font-family: var(--font-numbers); text-align: center; }
    .stx-figs { display: flex; flex-direction: column; gap: 12px; }
    .stx-fig-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px 62px; align-items: center; gap: 12px; }
    .stx-fig-label { font-size: 13px; color: #8490a4; }
    .stx-fig-bar { height: 2px; background-color: rgba(255,255,255,0.08); }
    .stx-fig-fill { height: 100%; background-color: rgba(255,255,255,0.7); }
    .stx-fig-row.-up .stx-fig-fill { background-color: var(--stx-up); }
    .stx-fig-row.-down .stx-fig-fill { background-color: var(--stx-down); }
    .stx-fig-value { font-size: 13px; color: #eaeef5; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .stx-fig-delta { font-size: 12px; color: #8490a4; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .stx-fig-row.-up .stx-fig-delta { color: var(--stx-up); }
    .stx-fig-row.-down .stx-fig-delta { color: var(--stx-down); }
    .stx-status { display: flex; align-items: center; justify-content: center; gap: 10px; color: #8490a4; font-size: 13px; padding: 60px 0; }
    .stx-status.-error { color: #fff; }
    .stx-status[hidden] { display: none; }
    .stx-empty { color: rgba(234,238,245,0.5); font-size: 13px; margin: 0; }
    .stx-summary { padding: 4px 0 20px; margin-bottom: 36px; border-bottom: 1px solid #1e2a3e; }
    .stx-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
    .stx-section { min-width: 0; }
    .stx-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; margin-bottom: 16px; border-bottom: 1px solid #1e2a3e; }
    .stx-section-title { margin: 0; font-size: 12.6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: rgba(234, 238, 245, 0.5); }
    .stx-section-title a { color: #fff; text-decoration: none; transition: color 0.15s ease; }
    .stx-section-note { flex: none; font-size: 12px; color: #8490a4; text-align: right; }
    .stx-section-note strong { color: #b3c2db; font-weight: 500; }
    .stx-section-note strong.-up { color: #32ab68; }
    .stx-arrow { display: inline-block; width: 11px; height: 11px; margin-left: 2px; vertical-align: -1px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .stx-page .section-heading-row .section-heading { flex: none; white-space: nowrap; }
    #record-insight { flex: 1 1 auto; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stx-section-note strong.-down { color: #f0605d; }
    .stx-list { display: flex; flex-direction: column; gap: 14px; }
    .stx-row { display: flex; flex-direction: column; gap: 6px; }
    .stx-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .stx-row-label { flex: 1; min-width: 0; font-size: 13.5px; color: rgba(255, 255, 255, 0.6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.stx-row-label { color: #fff; font-weight: 500; text-decoration: none; transition: color 0.15s ease; }
    .stx-row-value { flex: none; font-size: 12.5px; color: #8490a4; font-variant-numeric: tabular-nums; }
    .stx-row-value b { margin-right: 6px; color: #eaeef5; font-weight: 400; }
    .stx-bar { height: 2px; background-color: rgba(255,255,255,0.08); }
    .stx-bar-fill { height: 100%; background-color: rgba(255,255,255,0.7); }
    .stx-hl { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #151e2e; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    .stx-hl:first-child { padding-top: 0; border-top: 0; }
    .stx-hl:last-child { padding-bottom: 0; }
    .stx-hl-media { flex: none; width: 30px; height: 44px; border-radius: 3px; overflow: hidden; background-color: #191f29; display: flex; align-items: center; justify-content: center; color: #505a6b; font-size: 11px; }
    .stx-hl-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .stx-hl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .stx-hl-label { font-size: 12px; color: #8490a4; }
    .stx-hl-title { font-size: 13.5px; font-weight: 500; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.15s ease; }
    .stx-hl-value { flex: none; text-align: right; font-size: 14px; line-height: 1.2; color: #eaeef5; font-variant-numeric: tabular-nums; }
    .stx-hl-value .unit { display: block; margin-top: 2px; font-size: 11px; color: #8490a4; font-family: var(--font-text); }
    .stx-page .numbers { font-variant-numeric: tabular-nums; }
    @media (min-width: 900px) {
      .stx-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 56px; row-gap: 44px; }

      .stx-title { font-size: 2rem; }

      a.stx-row-label:hover, .stx-section-title a:hover { color: #fff; }
      .stx-hl:hover .stx-hl-title { color: #fff; }
    }
  </style>

<script>
(function () {
var btn = document.querySelector('.footer-email-btn');
if (!btn) return;
function fallbackCopy(text) {
var ta = document.createElement('textarea');
ta.value = text;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.focus();
ta.select();
try { document.execCommand('copy'); } catch (e) {}
document.body.removeChild(ta);
}
function showCopied() {
btn.classList.remove('-copied');
void btn.offsetWidth;
btn.classList.add('-copied');
clearTimeout(btn._copiedTimeout);
btn._copiedTimeout = setTimeout(function () {
btn.classList.remove('-copied');
}, 1400);
}
btn.addEventListener('click', function () {
var email = btn.getAttribute('data-email');
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(email).then(showCopied).catch(function () {
fallbackCopy(email);
showCopied();
});
} else {
fallbackCopy(email);
showCopied();
}
});
})();
</script>

  <script>
    (function () {
      var form = document.getElementById('home-search-form');
      var input = document.getElementById('home-search-input');
      var overlay = document.getElementById('page-loading-overlay');
      function goToResults() {
        var value = input.value.trim();
        if (!value) return;
        overlay.classList.add('-visible');
        window.location.href = '/search/?q=' + encodeURIComponent(value);
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        goToResults();
      });
      input.addEventListener('search', function () {
        goToResults();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          goToResults();
        }
      });
      window.addEventListener('pageshow', function () {
        overlay.classList.remove('-visible');
      });
    })();
  </script>

  <script>
    (function () {
      var SPINNER_HTML =
        '<div class="spinner -inline"><div></div><div></div><div></div><div></div><div></div><div></div></div>';
      var LOADING_HTML = '<div class="loading-shimmer">' + SPINNER_HTML + '</div>';
      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }
      function personPath(name, id) {
        var s = String(name || '');
        if (s.normalize) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        var base = s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        return '/p/' + (base ? base + '-' + id : String(id));
      }
      var GENRE_PAGES = {
        'Action & Adventure': 1, 'Animation': 1, 'Comedy': 1, 'Crime': 1, 'Documentary': 1, 'Drama': 1,
        'Family': 1, 'Kids': 1, 'Mystery': 1, 'News': 1, 'Reality': 1, 'Sci-Fi & Fantasy': 1, 'Soap': 1,
        'Talk': 1, 'War & Politics': 1, 'Western': 1
      };
      function genrePath(name) {
        var s = String(name || '');
        if (s.normalize) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        return '/g/?s=' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }
      function fmt1(v) {
        return (Math.round(v * 10) / 10).toString();
      }
      function initials(title) {
        if (!title) return '';
        var parts = title.trim().split(/\s+/).slice(0, 2);
        return parts.map(function (p) { return p.charAt(0).toUpperCase(); }).join('');
      }
      var menuMount = document.getElementById('stats-year-menu-mount');
      var figuresMount = document.getElementById('stat-figures');
      var statusEl = document.getElementById('stats-status');
      var content = document.getElementById('stats-content');
      var platformBars = document.getElementById('platform-bars');
      var platformInsight = document.getElementById('platform-insight');
      var highlightList = document.getElementById('highlight-list');
      var genreBars = document.getElementById('genre-bars');
      var genreInsight = document.getElementById('genre-insight');
      var directorBars = document.getElementById('director-bars');
      var directorInsight = document.getElementById('director-insight');
      var YEARS = Object.keys(STATS_YEARS).sort(function (a, b) { return a - b; });
      var DEFAULT_YEAR = YEARS[YEARS.length - 1] || null;
      var summaryCache = {};
      var currentYear = null;
      var yearTotals = null;
      var allRecordsPromise = null;
      var recordPoints = null;
      var yearTrigger = null;
      var yearOptionEls = {};
      var FIGURE_METRICS = [
        { key: 'shows', label: 'Shows' },
        { key: 'seasons', label: 'Seasons' },
        { key: 'hours', label: 'Hours' },
        { key: 'episodes', label: 'Episodes' }
      ];
      function renderFigures(year, summary) {
        if (!figuresMount) return;
        var cur = {
          shows: summary.showCount,
          seasons: summary.seasons,
          hours: summary.hours,
          episodes: summary.episodes
        };
        var idx = YEARS.indexOf(String(year));
        var prev = (yearTotals && idx > 0) ? yearTotals[YEARS[idx - 1]] : null;
        figuresMount.innerHTML = FIGURE_METRICS.map(function (m) {
          var value = cur[m.key];
          var delta = '–';
          var tone = '';
          if (prev) {
            var before = prev[m.key];
            if (before > 0) {
              var change = ((value - before) / before) * 100;
              if (change > 0.05) {
                tone = ' -up';
                delta = '+' + fmt1(change) + '%';
              } else if (change < -0.05) {
                tone = ' -down';
                delta = fmt1(change) + '%';
              } else {
                delta = '0%';
              }
            } else if (value > 0) {
              tone = ' -up';
              delta = 'new';
            }
          }
          var max = value;
          if (yearTotals) {
            YEARS.forEach(function (y) {
              if (yearTotals[y][m.key] > max) max = yearTotals[y][m.key];
            });
          }
          var width = (yearTotals && max > 0) ? (value / max) * 100 : 0;
          var shown = m.key === 'hours' ? fmt1(value) : String(Math.round(value));
          return (
            '<div class="stx-fig-row' + tone + '">' +
              '<span class="stx-fig-label">' + m.label + '</span>' +
              '<div class="stx-fig-bar"><div class="stx-fig-fill" style="width:' + width + '%"></div></div>' +
              '<span class="stx-fig-value numbers">' + shown + '</span>' +
              '<span class="stx-fig-delta numbers">' + delta + '</span>' +
            '</div>'
          );
        }).join('');
      }
      function loadAllRecords() {
        if (allRecordsPromise) return allRecordsPromise;
        var allIds = [];
        var seen = {};
        YEARS.forEach(function (year) {
          (STATS_YEARS[year] || []).forEach(function (s) {
            if (!seen[s.imdb]) { seen[s.imdb] = true; allIds.push(s.imdb); }
          });
        });
        if (!allIds.length) return null;
        allRecordsPromise = TVStats.fetchAll(allIds, true);
        return allRecordsPromise;
      }
      function loadYearTotals() {
        var promise = loadAllRecords();
        if (!promise) return;
        promise.then(function (records) {
          var totals = {};
          YEARS.forEach(function (year) {
            var s = TVStats.aggregate(STATS_YEARS[year] || [], records);
            totals[year] = { shows: s.showCount, seasons: s.seasons, hours: s.hours, episodes: s.episodes };
          });
          yearTotals = totals;
          if (currentYear && summaryCache[currentYear] && summaryCache[currentYear].showCount) {
            renderFigures(currentYear, summaryCache[currentYear]);
          }
        }).catch(function () {});
      }
      function renderBarList(mount, list, total, unit) {
        if (!list.length) {
          mount.innerHTML = '<p class="stx-empty">Not enough data yet.</p>';
          return;
        }
        mount.innerHTML = list.map(function (item) {
          var pct = total ? (item.value / total) * 100 : 0;
          var abs = unit === 'h' ? (fmt1(item.value) + 'h') : (Math.round(item.value) + ' eps');
          return (
            '<div class="stx-row">' +
              '<div class="stx-row-top">' +
                (item.href
                  ? '<a class="stx-row-label" href="' + escapeHtml(item.href) + '">' + escapeHtml(item.name) + '</a>'
                  : '<span class="stx-row-label">' + escapeHtml(item.name) + '</span>') +
                '<span class="stx-row-value numbers"><b>' + fmt1(pct) + '%</b>' + abs + '</span>' +
              '</div>' +
              '<div class="stx-bar"><div class="stx-bar-fill" style="width:' + Math.min(100, pct) + '%"></div></div>' +
            '</div>'
          );
        }).join('');
      }
      function computeHighlights(details) {
        var byRating = details.filter(function (d) { return d.rating > 0 && d.votes >= 15; })
          .sort(function (a, b) { return b.rating - a.rating; });
        var byHours = details.filter(function (d) { return d.hours > 0; })
          .sort(function (a, b) { return b.hours - a.hours; });
        var bySeasons = details.filter(function (d) { return d.seasons > 0; })
          .sort(function (a, b) { return b.seasons - a.seasons; });
        var withYear = details.filter(function (d) { return !!d.firstYear; });
        var byOldest = withYear.slice().sort(function (a, b) { return a.firstYear - b.firstYear; });
        var byNewest = withYear.slice().sort(function (a, b) { return b.firstYear - a.firstYear; });
        var items = [];
        if (byRating.length) {
          items.push({ label: 'Top Rated', show: byRating[0], value: byRating[0].rating.toFixed(1), unit: 'out of 10' });
        }
        if (byHours.length) {
          items.push({ label: 'Most Watched', show: byHours[0], value: fmt1(byHours[0].hours), unit: 'hours logged' });
        }
        if (bySeasons.length) {
          items.push({ label: 'Longest Running', show: bySeasons[0], value: bySeasons[0].seasons, unit: bySeasons[0].seasons === 1 ? 'season' : 'seasons' });
        }
        if (byOldest.length) {
          items.push({ label: 'Deepest Cut', show: byOldest[0], value: byOldest[0].firstYear, unit: 'premiere' });
        }
        if (byNewest.length && byNewest[0].imdb !== byOldest[0].imdb) {
          items.push({ label: 'Freshest Pick', show: byNewest[0], value: byNewest[0].firstYear, unit: 'premiere' });
        }
        return items.slice(0, 5);
      }
      function renderHighlights(details) {
        var items = computeHighlights(details);
        if (!items.length) { highlightList.innerHTML = '<p class="stx-empty">Not enough data yet.</p>'; return; }
        highlightList.innerHTML = items.map(function (item) {
          var show = item.show;
          var media = show.poster
            ? '<img src="' + show.poster + '" alt="" loading="lazy">'
            : escapeHtml(initials(show.title));
          return (
            '<a class="stx-hl" href="/show/?imdb=' + encodeURIComponent(show.imdb) + '">' +
              '<div class="stx-hl-media">' + media + '</div>' +
              '<div class="stx-hl-body">' +
                '<span class="stx-hl-label">' + escapeHtml(item.label) + '</span>' +
                '<span class="stx-hl-title">' + escapeHtml(show.title) + '</span>' +
              '</div>' +
              '<span class="stx-hl-value numbers">' + escapeHtml(String(item.value)) + '<span class="unit">' + escapeHtml(item.unit) + '</span></span>' +
            '</a>'
          );
        }).join('');
      }
      function showLoading() {
        content.hidden = true;
        statusEl.hidden = false;
        statusEl.classList.remove('-error');
        statusEl.innerHTML = LOADING_HTML;
      }
      function showError(message) {
        content.hidden = true;
        statusEl.hidden = false;
        statusEl.classList.add('-error');
        statusEl.textContent = message;
      }
      function hideStatus() {
        statusEl.hidden = true;
        statusEl.innerHTML = '';
      }
      function displaySummary(summary) {
        hideStatus();
        content.hidden = false;
        if (!summary.showCount) {
          content.hidden = true;
          statusEl.hidden = false;
          statusEl.classList.remove('-error');
          statusEl.innerHTML = '<p class="stx-empty">No shows logged for this year yet.</p>';
          return;
        }
        renderFigures(currentYear, summary);
        var platformList = TVStats.toRanked(summary.platforms, 6);
        renderBarList(platformBars, platformList, summary.hours, 'h');
        if (platformList.length) {
          platformInsight.innerHTML = '<strong>' + escapeHtml(platformList[0].name) + '</strong> led, ' +
            fmt1((platformList[0].value / summary.hours) * 100) + '%';
        } else {
          platformInsight.textContent = '';
        }
        renderHighlights(summary.details);
        var genreList = TVStats.toRanked(summary.genres, 8);
        genreList.forEach(function (item) {
          if (GENRE_PAGES[item.name]) item.href = genrePath(item.name);
        });
        renderBarList(genreBars, genreList, summary.hours, 'h');
        if (genreList.length) {
          genreInsight.innerHTML = '<strong>' + escapeHtml(genreList[0].name) + '</strong> led the year';
        } else {
          genreInsight.textContent = '';
        }
        var directorList = TVStats.toRanked(summary.directors, 8);
        directorList.forEach(function (item) {
          item.id = summary.directorIds[item.name];
          if (item.id) item.href = personPath(item.name, item.id);
        });
        renderBarList(directorBars, directorList, summary.episodes, 'eps');
        if (directorList.length) {
          directorInsight.innerHTML = '<strong>' + escapeHtml(directorList[0].name) + '</strong> most episodes';
        } else {
          directorInsight.textContent = '';
        }
      }
      var ARROW_UP = '<svg class="stx-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
      var ARROW_DOWN = '<svg class="stx-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
      function updateRecordInsight() {
        var insight = document.getElementById('record-insight');
        if (!insight) return;
        insight.innerHTML = '';
        if (!recordPoints || currentYear === null) return;
        var idx = -1;
        for (var i = 0; i < recordPoints.length; i++) {
          if (String(recordPoints[i].year) === String(currentYear)) idx = i;
        }
        if (idx < 1) return;
        var cur = recordPoints[idx];
        var before = recordPoints[idx - 1];
        if (!(before.hours > 0)) return;
        var change = ((cur.hours - before.hours) / before.hours) * 100;
        var tone = change > 0.05 ? 'up' : (change < -0.05 ? 'down' : '');
        var pct = tone ? (change > 0 ? '+' : '') + fmt1(change) + '%' : '0%';
        var arrow = tone === 'up' ? ARROW_UP : (tone === 'down' ? ARROW_DOWN : '');
        insight.innerHTML = '<strong' + (tone ? ' class="-' + tone + '"' : '') + '>' + pct + ' ' + arrow + '</strong> compared to ' + before.year;
      }
      function setActiveTab(year) {
        var current = String(year);
        if (yearTrigger) yearTrigger.textContent = current;
        Object.keys(yearOptionEls).forEach(function (k) {
          var on = k === current;
          yearOptionEls[k].classList.toggle('-active', on);
          yearOptionEls[k].setAttribute('aria-checked', on ? 'true' : 'false');
        });
        updateRecordInsight();
      }
      function renderYear(year) {
        currentYear = year;
        setActiveTab(year);
        if (summaryCache[year]) {
          displaySummary(summaryCache[year]);
          return;
        }
        showLoading();
        var showList = STATS_YEARS[year] || [];
        var ids = showList.map(function (s) { return s.imdb; });
        TVStats.fetchAll(ids, true).then(function (records) {
          if (currentYear !== year) return;
          var summary = TVStats.aggregate(showList, records);
          summaryCache[year] = summary;
          displaySummary(summary);
        }).catch(function () {
          if (currentYear !== year) return;
          showError('Something went wrong pulling stats for ' + year + '. Try again in a moment.');
        });
      }
      function loadRecord() {
        var recordsPromise = loadAllRecords();
        if (!recordsPromise) return;
        recordsPromise.then(function (records) {
          recordPoints = YEARS.slice().sort(function (a, b) { return a - b; }).map(function (year) {
            var summary = TVStats.aggregate(STATS_YEARS[year] || [], records);
            return { year: year, hours: summary.hours };
          });
          updateRecordInsight();
        }).catch(function () {});
      }
      function buildYearMenu() {
        if (!menuMount || !YEARS.length) return;
        var wrapper = document.createElement('div');
        wrapper.className = 'sort-menu-wrapper';
        yearTrigger = document.createElement('button');
        yearTrigger.type = 'button';
        yearTrigger.className = 'sort-trigger year-trigger numbers';
        yearTrigger.setAttribute('aria-label', 'Choose stats year');
        yearTrigger.setAttribute('aria-haspopup', 'true');
        yearTrigger.setAttribute('aria-expanded', 'false');
        var menu = document.createElement('div');
        menu.className = 'sort-menu year-menu';
        menu.setAttribute('role', 'menu');
        var row = document.createElement('div');
        row.className = 'sort-row';
        var choices = document.createElement('div');
        choices.className = 'sort-choices';
        YEARS.slice().reverse().forEach(function (year) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'sort-option year-option';
          btn.setAttribute('role', 'menuitemradio');
          btn.setAttribute('aria-checked', 'false');
          btn.dataset.year = year;
          btn.textContent = year;
          choices.appendChild(btn);
          yearOptionEls[year] = btn;
        });
        row.appendChild(choices);
        menu.appendChild(row);
        wrapper.appendChild(yearTrigger);
        wrapper.appendChild(menu);
        menuMount.appendChild(wrapper);
        function openMenu() {
          menu.classList.add('-open');
          yearTrigger.setAttribute('aria-expanded', 'true');
        }
        function closeMenu() {
          menu.classList.remove('-open');
          yearTrigger.setAttribute('aria-expanded', 'false');
        }
        yearTrigger.addEventListener('click', function (e) {
          e.stopPropagation();
          if (menu.classList.contains('-open')) {
            closeMenu();
          } else {
            openMenu();
          }
        });
        document.addEventListener('click', function (e) {
          if (!wrapper.contains(e.target)) closeMenu();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeMenu();
        });
        menu.addEventListener('click', function (e) {
          var target = e.target;
          if (!target.classList || !target.classList.contains('year-option')) return;
          closeMenu();
          if (target.dataset.year !== String(currentYear)) renderYear(target.dataset.year);
        });
      }
      buildYearMenu();
      loadRecord();
      loadYearTotals();
      if (DEFAULT_YEAR) {
        renderYear(DEFAULT_YEAR);
      } else {
        showError('No past years to show yet.');
      }
    })();
  </script>
<script src="/js/auth.js?v=1"></script>
