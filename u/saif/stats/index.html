  <style>
    .site-header { position: relative; height: 52px; background-color: #0b121e; }
    @media (min-width: 1024px) { .site-header { height: 76px; } }
    .page-content { padding-top: 0px; width: 100%; min-width: 0; }
    .stx-page { margin-top: 6px; }
    .stx-top { margin-bottom: 24px; }
    .stx-title { margin: 0; font-size: 1.5rem; line-height: 1.15; color: #fff; display: flex; align-items: baseline; gap: 9px; }
    .stx-title .numbers { color: #fff; font-weight: 500; }
    .stx-title-label { color: #eaeef5; }
    .stx-meta { margin: 8px 0 0; font-size: 12.5px; color: #8490a4; min-height: 1.4em; }
    .stx-years { display: flex; flex-wrap: nowrap; gap: 20px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
    .stx-years::-webkit-scrollbar { display: none; }
    .stx-year { flex: 0 0 auto; padding: 2px 0 5px; border: 0; border-bottom: 1px solid transparent; background: none; color: #6f7c91; font-family: var(--font-numbers); font-size: 14px; cursor: pointer; transition: color 0.15s ease; }
    .stx-year:hover { color: #b3c2db; }
    .stx-year.-active { color: #fff; border-bottom-color: #fff; }
    .stx-status { display: flex; align-items: center; justify-content: center; gap: 10px; color: #8490a4; font-size: 13px; padding: 60px 0; }
    .stx-status.-error { color: #fff; }
    .stx-status[hidden] { display: none; }
    .stx-empty { color: rgba(234,238,245,0.5); font-size: 13px; margin: 0; }
    .stx-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 20px 0; margin-bottom: 36px; border-top: 1px solid #1e2a3e; border-bottom: 1px solid #1e2a3e; }
    .stx-fig { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .stx-fig-value { font-size: clamp(1.25rem, 6vw, 1.6rem); line-height: 1.1; color: #fff; font-weight: 500; font-variant-numeric: tabular-nums; }
    .stx-fig-label { font-size: 12px; color: #8490a4; }
    .stx-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
    .stx-section { min-width: 0; }
    .stx-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .stx-section-title { margin: 0; font-size: 14px; font-weight: 600; color: #eaeef5; }
    .stx-section-title a { color: inherit; text-decoration: none; transition: color 0.15s ease; }
    .stx-section-note { flex: none; font-size: 12px; color: #8490a4; text-align: right; }
    .stx-section-note strong { color: #b3c2db; font-weight: 500; }
    .stx-list { display: flex; flex-direction: column; gap: 14px; }
    .stx-row { display: flex; flex-direction: column; gap: 6px; }
    .stx-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .stx-row-label { flex: 1; min-width: 0; font-size: 13.5px; color: #eaeef5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.stx-row-label { text-decoration: none; transition: color 0.15s ease; }
    .stx-row-value { flex: none; font-size: 12.5px; color: #8490a4; font-variant-numeric: tabular-nums; }
    .stx-row-value b { margin-right: 6px; color: #eaeef5; font-weight: 400; }
    .stx-bar { height: 2px; background-color: rgba(255,255,255,0.08); }
    .stx-bar-fill { height: 100%; background-color: rgba(255,255,255,0.7); }
    .stx-record { display: flex; flex-direction: column; gap: 12px; }
    .stx-record-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) 58px 50px; align-items: center; gap: 12px; }
    .stx-record-year { font-size: 13px; color: #8490a4; font-variant-numeric: tabular-nums; }
    .stx-record-row.-current .stx-record-year { color: #fff; }
    .stx-record-bar { height: 2px; background-color: rgba(255,255,255,0.08); }
    .stx-record-fill { height: 100%; background-color: rgba(255,255,255,0.3); }
    .stx-record-row.-current .stx-record-fill { background-color: #fff; }
    .stx-record-value { font-size: 13px; color: #eaeef5; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .stx-record-delta { font-size: 12px; color: #8490a4; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .stx-hl { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #151e2e; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    .stx-hl:first-child { padding-top: 0; border-top: 0; }
    .stx-hl:last-child { padding-bottom: 0; }
    .stx-hl-media { flex: none; width: 30px; height: 44px; border-radius: 3px; overflow: hidden; background-color: #191f29; display: flex; align-items: center; justify-content: center; color: #505a6b; font-size: 11px; }
    .stx-hl-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .stx-hl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .stx-hl-label { font-size: 12px; color: #8490a4; }
    .stx-hl-title { font-size: 13.5px; color: #eaeef5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.15s ease; }
    .stx-hl-value { flex: none; text-align: right; font-size: 14px; line-height: 1.2; color: #eaeef5; font-variant-numeric: tabular-nums; }
    .stx-hl-value .unit { display: block; margin-top: 2px; font-size: 11px; color: #8490a4; font-family: var(--font-text); }
    .stx-page .numbers { font-variant-numeric: tabular-nums; }
    @media (min-width: 900px) {
      .stx-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 56px; row-gap: 44px; }
      .stx-wide { grid-column: 1 / -1; }
    }
    @media (min-width: 1024px) {
      .stx-page { margin-top: 10px; }
      .stx-title { font-size: 2rem; }
      .stx-meta { font-size: 13px; }
      .stx-fig-value { font-size: 2rem; }
      .stx-fig-label { font-size: 13px; }
    }
    @media (hover: hover) and (pointer: fine) {
      a.stx-row-label:hover, .stx-section-title a:hover { color: #29a6ff; }
      .stx-hl:hover .stx-hl-title { color: #29a6ff; }
    }
  </style>
</head>

<script>
(function () {
var btn = document.querySelector('.footer-email-btn');
if (!btn) return;
function fallbackCopy(text) {
var ta = document.createElement('textarea');
ta.value = text;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.focus();
ta.select();
try { document.execCommand('copy'); } catch (e) {}
document.body.removeChild(ta);
}
function showCopied() {
btn.classList.remove('-copied');
void btn.offsetWidth;
btn.classList.add('-copied');
clearTimeout(btn._copiedTimeout);
btn._copiedTimeout = setTimeout(function () {
btn.classList.remove('-copied');
}, 1400);
}
btn.addEventListener('click', function () {
var email = btn.getAttribute('data-email');
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(email).then(showCopied).catch(function () {
fallbackCopy(email);
showCopied();
});
} else {
fallbackCopy(email);
showCopied();
}
});
})();
</script>
  <div id="page-loading-overlay" class="page-loading-overlay">
    <div class="loading-shimmer -fullscreen">

  <script>
    (function () {
      var form = document.getElementById('home-search-form');
      var input = document.getElementById('home-search-input');
      var overlay = document.getElementById('page-loading-overlay');
      function goToResults() {
        var value = input.value.trim();
        if (!value) return;
        overlay.classList.add('-visible');
        window.location.href = '/search/?q=' + encodeURIComponent(value);
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        goToResults();
      });
      input.addEventListener('search', function () {
        goToResults();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          goToResults();
        }
      });
      window.addEventListener('pageshow', function () {
        overlay.classList.remove('-visible');
      });
    })();
  </script>
  <script src="/js/shows.js?v=1"></script>
  <script src="/js/stats.js?v=4"></script>
  <script>
    (function () {
      var SPINNER_HTML =
        '<div class="spinner -inline"><div></div><div></div><div></div><div></div><div></div><div></div></div>';
      var LOADING_HTML = '<div class="loading-shimmer">' + SPINNER_HTML + '</div>';
      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }
      function personPath(name, id) {
        var s = String(name || '');
        if (s.normalize) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        var base = s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        return '/p/' + (base ? base + '-' + id : String(id));
      }
      function fmt1(v) {
        return (Math.round(v * 10) / 10).toString();
      }
      function initials(title) {
        if (!title) return '';
        var parts = title.trim().split(/\s+/).slice(0, 2);
        return parts.map(function (p) { return p.charAt(0).toUpperCase(); }).join('');
      }
      var headingYear = document.getElementById('stats-heading-year');
      var metaLine = document.getElementById('stx-meta');
      var tabsMount = document.getElementById('stats-year-tabs');
      var statusEl = document.getElementById('stats-status');
      var content = document.getElementById('stats-content');
      var statHours = document.getElementById('stat-hours');
      var statEpisodes = document.getElementById('stat-episodes');
      var statSeasons = document.getElementById('stat-seasons');
      var statShows = document.getElementById('stat-shows');
      var platformBars = document.getElementById('platform-bars');
      var platformInsight = document.getElementById('platform-insight');
      var highlightList = document.getElementById('highlight-list');
      var genreBars = document.getElementById('genre-bars');
      var genreInsight = document.getElementById('genre-insight');
      var directorBars = document.getElementById('director-bars');
      var directorInsight = document.getElementById('director-insight');
      var YEARS = Object.keys(STATS_YEARS).sort(function (a, b) { return a - b; });
      var DEFAULT_YEAR = YEARS[YEARS.length - 1] || null;
      var summaryCache = {};
      var currentYear = null;
      var recordActiveYear = null;
      function renderBarList(mount, list, total, unit) {
        if (!list.length) {
          mount.innerHTML = '<p class="stx-empty">Not enough data yet.</p>';
          return;
        }
        mount.innerHTML = list.map(function (item) {
          var pct = total ? (item.value / total) * 100 : 0;
          var abs = unit === 'h' ? (fmt1(item.value) + 'h') : (Math.round(item.value) + ' eps');
          return (
            '<div class="stx-row">' +
              '<div class="stx-row-top">' +
                (item.id
                  ? '<a class="stx-row-label" href="' + escapeHtml(personPath(item.name, item.id)) + '">' + escapeHtml(item.name) + '</a>'
                  : '<span class="stx-row-label">' + escapeHtml(item.name) + '</span>') +
                '<span class="stx-row-value numbers"><b>' + fmt1(pct) + '%</b>' + abs + '</span>' +
              '</div>' +
              '<div class="stx-bar"><div class="stx-bar-fill" style="width:' + Math.min(100, pct) + '%"></div></div>' +
            '</div>'
          );
        }).join('');
      }
      function computeHighlights(details) {
        var byRating = details.filter(function (d) { return d.rating > 0 && d.votes >= 15; })
          .sort(function (a, b) { return b.rating - a.rating; });
        var byHours = details.filter(function (d) { return d.hours > 0; })
          .sort(function (a, b) { return b.hours - a.hours; });
        var bySeasons = details.filter(function (d) { return d.seasons > 0; })
          .sort(function (a, b) { return b.seasons - a.seasons; });
        var withYear = details.filter(function (d) { return !!d.firstYear; });
        var byOldest = withYear.slice().sort(function (a, b) { return a.firstYear - b.firstYear; });
        var byNewest = withYear.slice().sort(function (a, b) { return b.firstYear - a.firstYear; });
        var items = [];
        if (byRating.length) {
          items.push({ label: 'Top Rated', show: byRating[0], value: byRating[0].rating.toFixed(1), unit: 'out of 10' });
        }
        if (byHours.length) {
          items.push({ label: 'Most Watched', show: byHours[0], value: fmt1(byHours[0].hours), unit: 'hours logged' });
        }
        if (bySeasons.length) {
          items.push({ label: 'Longest Running', show: bySeasons[0], value: bySeasons[0].seasons, unit: bySeasons[0].seasons === 1 ? 'season' : 'seasons' });
        }
        if (byOldest.length) {
          items.push({ label: 'Deepest Cut', show: byOldest[0], value: byOldest[0].firstYear, unit: 'premiere' });
        }
        if (byNewest.length && byNewest[0].imdb !== byOldest[0].imdb) {
          items.push({ label: 'Freshest Pick', show: byNewest[0], value: byNewest[0].firstYear, unit: 'premiere' });
        }
        return items.slice(0, 5);
      }
      function renderHighlights(details) {
        var items = computeHighlights(details);
        if (!items.length) { highlightList.innerHTML = '<p class="stx-empty">Not enough data yet.</p>'; return; }
        highlightList.innerHTML = items.map(function (item) {
          var show = item.show;
          var media = show.poster
            ? '<img src="' + show.poster + '" alt="" loading="lazy">'
            : escapeHtml(initials(show.title));
          return (
            '<a class="stx-hl" href="/show/?imdb=' + encodeURIComponent(show.imdb) + '">' +
              '<div class="stx-hl-media">' + media + '</div>' +
              '<div class="stx-hl-body">' +
                '<span class="stx-hl-label">' + escapeHtml(item.label) + '</span>' +
                '<span class="stx-hl-title">' + escapeHtml(show.title) + '</span>' +
              '</div>' +
              '<span class="stx-hl-value numbers">' + escapeHtml(String(item.value)) + '<span class="unit">' + escapeHtml(item.unit) + '</span></span>' +
            '</a>'
          );
        }).join('');
      }
      function showLoading() {
        content.hidden = true;
        statusEl.hidden = false;
        statusEl.classList.remove('-error');
        statusEl.innerHTML = LOADING_HTML;
      }
      function showError(message) {
        content.hidden = true;
        statusEl.hidden = false;
        statusEl.classList.add('-error');
        statusEl.textContent = message;
      }
      function hideStatus() {
        statusEl.hidden = true;
        statusEl.innerHTML = '';
      }
      function displaySummary(summary) {
        hideStatus();
        content.hidden = false;
        if (!summary.showCount) {
          content.hidden = true;
          statusEl.hidden = false;
          statusEl.classList.remove('-error');
          statusEl.innerHTML = '<p class="stx-empty">No shows logged for this year yet.</p>';
          metaLine.textContent = '';
          return;
        }
        var metaParts = [Math.round(summary.showCount) + (summary.showCount === 1 ? ' show' : ' shows')];
        if (summary.ratedShowCount) metaParts.push('avg rating ' + fmt1(summary.avgRating) + ' / 10');
        metaLine.innerHTML = metaParts.join(' &nbsp;·&nbsp; ');
        statHours.textContent = fmt1(summary.hours);
        statEpisodes.textContent = Math.round(summary.episodes);
        statSeasons.textContent = Math.round(summary.seasons);
        statShows.textContent = Math.round(summary.showCount);
        var platformList = TVStats.toRanked(summary.platforms, 6);
        renderBarList(platformBars, platformList, summary.hours, 'h');
        if (platformList.length) {
          platformInsight.innerHTML = '<strong>' + escapeHtml(platformList[0].name) + '</strong> led, ' +
            fmt1((platformList[0].value / summary.hours) * 100) + '%';
        } else {
          platformInsight.textContent = '';
        }
        renderHighlights(summary.details);
        var genreList = TVStats.toRanked(summary.genres, 8);
        renderBarList(genreBars, genreList, summary.hours, 'h');
        if (genreList.length) {
          genreInsight.innerHTML = '<strong>' + escapeHtml(genreList[0].name) + '</strong> led the year';
        } else {
          genreInsight.textContent = '';
        }
        var directorList = TVStats.toRanked(summary.directors, 8);
        directorList.forEach(function (item) { item.id = summary.directorIds[item.name]; });
        renderBarList(directorBars, directorList, summary.episodes, 'eps');
        if (directorList.length) {
          directorInsight.innerHTML = '<strong>' + escapeHtml(directorList[0].name) + '</strong> most episodes';
        } else {
          directorInsight.textContent = '';
        }
      }
      function markRecordYear(year) {
        recordActiveYear = year;
        var rows = document.querySelectorAll('.stx-record-row');
        Array.prototype.forEach.call(rows, function (row) {
          row.classList.toggle('-current', row.getAttribute('data-year') === String(year));
        });
      }
      function setActiveTab(year) {
        var tabs = tabsMount.querySelectorAll('.stx-year');
        tabs.forEach(function (tab) {
          tab.classList.toggle('-active', tab.dataset.year === String(year));
        });
        headingYear.textContent = year;
        markRecordYear(year);
        var activeTab = tabsMount.querySelector('.stx-year.-active');
        if (activeTab) {
          var tr = tabsMount.getBoundingClientRect();
          var ar = activeTab.getBoundingClientRect();
          var target = tabsMount.scrollLeft + (ar.left - tr.left) - (tr.width - ar.width) / 2;
          tabsMount.scrollLeft = Math.max(0, target);
        }
      }
      function renderYear(year) {
        currentYear = year;
        setActiveTab(year);
        if (summaryCache[year]) {
          displaySummary(summaryCache[year]);
          return;
        }
        showLoading();
        metaLine.textContent = '';
        var showList = STATS_YEARS[year] || [];
        var ids = showList.map(function (s) { return s.imdb; });
        TVStats.fetchAll(ids, true).then(function (records) {
          if (currentYear !== year) return;
          var summary = TVStats.aggregate(showList, records);
          summaryCache[year] = summary;
          displaySummary(summary);
        }).catch(function () {
          if (currentYear !== year) return;
          showError('Something went wrong pulling stats for ' + year + '. Try again in a moment.');
        });
      }
      function loadRecord() {
        var mount = document.getElementById('record-chart-mount');
        var insight = document.getElementById('record-insight');
        if (!mount) return;
        var allIds = [];
        var seen = {};
        YEARS.forEach(function (year) {
          (STATS_YEARS[year] || []).forEach(function (s) {
            if (!seen[s.imdb]) { seen[s.imdb] = true; allIds.push(s.imdb); }
          });
        });
        if (!allIds.length) return;
        TVStats.fetchAll(allIds, true).then(function (records) {
          var points = YEARS.slice().sort(function (a, b) { return a - b; }).map(function (year) {
            var summary = TVStats.aggregate(STATS_YEARS[year] || [], records);
            return { year: year, hours: summary.hours };
          });
          if (points.length < 2) {
            mount.innerHTML = '<p class="stx-empty">Not enough years logged yet to show a record.</p>';
            return;
          }
          var maxHours = Math.max.apply(null, points.map(function (p) { return p.hours; })) || 1;
          mount.innerHTML = '<div class="stx-record">' + points.map(function (p, i) {
            var delta = '–';
            if (i > 0) {
              var prev = points[i - 1].hours;
              if (prev > 0) {
                var change = ((p.hours - prev) / prev) * 100;
                delta = (change > 0 ? '+' : '') + fmt1(change) + '%';
              } else if (p.hours > 0) {
                delta = 'new';
              }
            }
            var isCurrent = String(p.year) === String(recordActiveYear);
            return (
              '<div class="stx-record-row' + (isCurrent ? ' -current' : '') + '" data-year="' + p.year + '">' +
                '<span class="stx-record-year numbers">' + p.year + '</span>' +
                '<div class="stx-record-bar"><div class="stx-record-fill" style="width:' + (p.hours / maxHours) * 100 + '%"></div></div>' +
                '<span class="stx-record-value numbers">' + fmt1(p.hours) + 'h</span>' +
                '<span class="stx-record-delta numbers">' + delta + '</span>' +
              '</div>'
            );
          }).join('') + '</div>';
          if (insight) {
            var last = points[points.length - 1];
            var before = points[points.length - 2];
            if (before.hours > 0) {
              var overallChange = ((last.hours - before.hours) / before.hours) * 100;
              var word = overallChange > 1 ? 'up' : (overallChange < -1 ? 'down' : 'flat');
              insight.innerHTML = '<strong>' + (overallChange > 0 ? '+' : '') + fmt1(overallChange) + '%</strong> ' + word + ' vs ' + before.year;
            }
          }
        }).catch(function () {
          mount.innerHTML = '<p class="stx-empty">Could not load the record right now.</p>';
        });
      }
      YEARS.forEach(function (year) {
        var tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'stx-year numbers';
        tab.textContent = year;
        tab.dataset.year = year;
        tab.addEventListener('click', function () {
          renderYear(year);
        });
        tabsMount.appendChild(tab);
      });
      loadRecord();
      if (DEFAULT_YEAR) {
        renderYear(DEFAULT_YEAR);
      } else {
        showError('No past years to show yet.');
      }
    })();
  </script>
