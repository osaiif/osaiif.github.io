<script>
(function () {
var btn = document.querySelector('.footer-email-btn');
if (!btn) return;
function fallbackCopy(text) {
var ta = document.createElement('textarea');
ta.value = text;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.focus();
ta.select();
try { document.execCommand('copy'); } catch (e) {}
document.body.removeChild(ta);
}
function showCopied() {
btn.classList.remove('-copied');
void btn.offsetWidth;
btn.classList.add('-copied');
clearTimeout(btn._copiedTimeout);
btn._copiedTimeout = setTimeout(function () {
btn.classList.remove('-copied');
}, 1400);
}
btn.addEventListener('click', function () {
var email = btn.getAttribute('data-email');
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(email).then(showCopied).catch(function () {
fallbackCopy(email);
showCopied();
});
} else {
fallbackCopy(email);
showCopied();
}
});
})();
</script>
  <div id="page-loading-overlay" class="page-loading-overlay">

  <script>
    (function () {
      var TMDB_API_KEYS = [
        '6cb6e1dc603bc65ffb6198489d5bc5b7',
        '2e7b2fe7002c21f45f08c0a03aa9df52',
        '51952b66efcd80289c3ba5f8f8044e6a'
      ];
      var TMDB_BASE = 'https://api.themoviedb.org/3';
      function tmdbGet(path, query) {
        return new Promise(function (resolve, reject) {
          var controllers = [];
          var failures = 0;
          var settled = false;
          var bestError = null;
          function isAuthError(err) {
            return !!err && (err.status === 401 || err.status === 403);
          }
          function onFail(err) {
            if (settled) return;
            failures++;
            if (!bestError || (isAuthError(bestError) && !isAuthError(err))) bestError = err;
            if (failures === TMDB_API_KEYS.length) {
              settled = true;
              reject(bestError);
            }
          }
          TMDB_API_KEYS.forEach(function (key, index) {
            var controller = typeof AbortController === 'function' ? new AbortController() : null;
            controllers.push(controller);
            fetch(
              TMDB_BASE + path + '?api_key=' + key + (query ? '&' + query : ''),
              controller ? { signal: controller.signal } : undefined
            )
              .then(function (res) {
                if (!res.ok) {
                  var err = new Error('TMDB request failed (' + res.status + ')');
                  err.status = res.status;
                  throw err;
                }
                return res.json();
              })
              .then(function (data) {
                if (settled) return;
                settled = true;
                controllers.forEach(function (c, i) {
                  if (c && i !== index) c.abort();
                });
                resolve(data);
              })
              .catch(onFail);
          });
        });
      }
      window.tvboxTmdbGet = tmdbGet;
      var POSTER_BASE = 'https://image.tmdb.org/t/p/w500';
      var BACKDROP_BASE = 'https://image.tmdb.org/t/p/original';
      var statusEl = document.getElementById('show-status');
      var hero = document.getElementById('show-hero');
      var backdropImage = document.querySelector('.js-show-backdrop-image');
      var trailerBtn = document.getElementById('trailer-btn');
      function pickTrailerUrl(show) {
        var results = (show.videos && show.videos.results) || [];
        var onYouTube = results.filter(function (v) { return v.site === 'YouTube'; });
        function first(pred) {
          var matches = onYouTube.filter(pred);
          return matches.length ? matches[0] : null;
        }
        var best =
          first(function (v) { return v.type === 'Trailer' && v.official && v.iso_639_1 === 'en'; }) ||
          first(function (v) { return v.type === 'Trailer' && v.official; }) ||
          first(function (v) { return v.type === 'Trailer' && v.iso_639_1 === 'en'; }) ||
          first(function (v) { return v.type === 'Trailer'; }) ||
          first(function (v) { return v.type === 'Teaser' && v.official; }) ||
          first(function (v) { return v.type === 'Teaser'; });
        return best ? ('https://www.youtube.com/watch?v=' + best.key) : null;
      }
      function openTrailer(webUrl) {
        var match = /[?&]v=([^&]+)/.exec(webUrl);
        var key = match ? match[1] : null;
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (key && isAndroid) {
          window.location.href = 'intent://www.youtube.com/watch?v=' + key +
            '#Intent;scheme=https;package=com.google.android.youtube;' +
            'S.browser_fallback_url=' + encodeURIComponent(webUrl) + ';end';
          return;
        }
        var link = document.createElement('a');
        link.href = webUrl;
        link.style.display = 'none';
        if (isIOS) {
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          return;
        }
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
      function setupTrailer(show) {
        trailerBtn.onclick = null;
        trailerBtn.hidden = true;
        var url = pickTrailerUrl(show);
        if (!url) return;
        trailerBtn.onclick = function () {
          openTrailer(url);
        };
        trailerBtn.hidden = false;
      }
      var SPINNER_HTML =
        '<div class="spinner -inline"><div></div><div></div><div></div><div></div><div></div><div></div></div>';
      function setStatus(html, isError) {
        if (!html) {
          statusEl.hidden = true;
          statusEl.innerHTML = '';
          statusEl.classList.remove('-error');
          return;
        }
        statusEl.hidden = false;
        statusEl.innerHTML = html;
        statusEl.classList.toggle('-error', !!isError);
      }
      function slugifyGenre(name) {
        var s = String(name || '');
        if (s.normalize) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }
      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }
      function yearFromDate(dateStr) {
        return dateStr ? dateStr.slice(0, 4) : null;
      }
      function statusLabel(status) {
        return status || null;
      }
      var params = new URLSearchParams(window.location.search);
      var showId = params.get('id');
      var imdbId = params.get('imdb');
      function loadShow(id) {
        setStatus(SPINNER_HTML);
        tmdbGet('/tv/' + encodeURIComponent(id), 'append_to_response=external_ids,videos')
          .then(renderShow)
          .catch(function (err) {
            setStatus('Something went wrong: ' + err.message, true);
          });
      }
      if (showId) {
        loadShow(showId);
      } else if (imdbId) {
        setStatus(SPINNER_HTML);
        tmdbGet('/find/' + encodeURIComponent(imdbId), 'external_source=imdb_id')
          .then(function (found) {
            var match = found.tv_results && found.tv_results[0];
            if (!match) throw new Error('No matching show found on TMDB');
            loadShow(match.id);
          })
          .catch(function (err) {
            setStatus('Something went wrong: ' + err.message, true);
          });
      } else {
        setStatus('No show selected. Head back to <a href="/search/">search</a> and pick one.', true);
      }
      function renderShow(show) {
            setStatus('');
            var backdropUrl = show.backdrop_path
              ? BACKDROP_BASE + show.backdrop_path
              : (show.poster_path ? BACKDROP_BASE + show.poster_path : null);
            if (backdropUrl) {
              var preload = new Image();
              preload.onload = function () {
                backdropImage.style.backgroundImage = 'url("' + backdropUrl + '")';
                backdropImage.classList.add('is-loaded');
              };
              preload.src = backdropUrl;
            }
            var BLANK_IMG = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
            var posterImg = document.getElementById('show-poster-img');
            posterImg.onerror = function () {
              posterImg.onerror = null;
              posterImg.alt = '';
              posterImg.src = BLANK_IMG;
            };
            if (show.poster_path) {
              posterImg.alt = show.name || '';
              posterImg.src = POSTER_BASE + show.poster_path;
            } else {
              posterImg.alt = '';
              posterImg.src = BLANK_IMG;
            }
            document.getElementById('show-title').textContent = show.name || 'Untitled';
            document.title = (show.name || 'Untitled') + ' ǀ tvbox';
            window.tvboxShowMeta = {
              id: show.id,
              name: show.name || 'this show',
              firstAirDate: show.first_air_date || null,
              seasons: (show.seasons || []).map(function (s) {
                return {
                  number: s.season_number,
                  name: s.name || null,
                  episodes: s.episode_count || 0,
                  airDate: s.air_date || null,
                  poster: s.poster_path || null
                };
              })
            };
            var year = yearFromDate(show.first_air_date);
            var metaParts = [];
            if (year) metaParts.push('<span class="numbers"><a href="/y/?y=' + year + '">' + year + '</a></span>');
            var status = statusLabel(show.status);
            if (status) metaParts.push('<span>' + escapeHtml(status) + '</span>');
            if (show.number_of_seasons) {
              metaParts.push('<span>' + show.number_of_seasons + ' season' + (show.number_of_seasons === 1 ? '' : 's') + '</span>');
            }
            document.getElementById('show-meta').innerHTML = metaParts.join('<span class="show-meta-dot">·</span>');
            var genresEl = document.getElementById('show-genres');
            var genres = show.genres || [];
            if (genres.length) {
              genresEl.innerHTML = genres.map(function (g) {
                return '<a class="genre-tag" href="/g/?s=' + slugifyGenre(g.name) + '">' + escapeHtml(g.name) + '</a>';
              }).join('<span class="genre-sep">·</span>');
            }
            document.getElementById('show-rating-value').textContent =
              show.vote_average ? show.vote_average.toFixed(1) : '–';
            document.getElementById('show-seasons-value').textContent =
              show.number_of_seasons != null ? show.number_of_seasons : '–';
            document.getElementById('show-episodes-value').textContent =
              show.number_of_episodes != null ? show.number_of_episodes : '–';
            document.getElementById('show-overview').textContent = show.overview || '';
            var hasNothing = !show.overview && !show.number_of_seasons && !show.number_of_episodes;
            hero.classList.toggle('-no-actions', hasNothing);
            hero.hidden = false;
            document.dispatchEvent(new CustomEvent('tvbox:show-loaded'));
            setupTrailer(show);
      }
    })();
  </script>
  <script>
    (function () {
      var form = document.getElementById('home-search-form');
      var input = document.getElementById('home-search-input');
      var overlay = document.getElementById('page-loading-overlay');
      function goToResults() {
        var value = input.value.trim();
        if (!value) return;
        overlay.classList.add('-visible');
        window.location.href = '/search/?q=' + encodeURIComponent(value);
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        goToResults();
      });
      input.addEventListener('search', function () {
        goToResults();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          goToResults();
        }
      });
      window.addEventListener('pageshow', function () {
        overlay.classList.remove('-visible');
      });
    })();
  </script>
  <script>
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && document.activeElement) {
        document.activeElement.blur();
      }
    });
  </script>
<script src="/js/auth.js?v=1"></script>
<script src="/js/showmarking.js?v=3"></script>
</body>
</html>
